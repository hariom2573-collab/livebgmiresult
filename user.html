<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>User Management</title>

<link rel="manifest" href="manifest.json">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#020617;
color:#fff;
overflow-x:hidden;
padding-bottom:80px;
}

body::-webkit-scrollbar{
display:none;
}

/* Header */

.header{
height:65px;
background:#111827;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 18px;
position:sticky;
top:0;
z-index:100;
border-bottom:1px solid #1f2937;
}

.logo{
font-size:22px;
font-weight:bold;
color:#22c55e;
}

.backBtn{
padding:10px 18px;
border:none;
border-radius:10px;
background:#2563eb;
color:#fff;
font-weight:bold;
cursor:pointer;
}

/* Dashboard */

.dashboard{
width:95%;
margin:20px auto;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.card{
background:#111827;
padding:18px;
border-radius:18px;
box-shadow:0 10px 20px rgba(0,0,0,.35);
}

.card-title{
font-size:13px;
color:#94a3b8;
}

.card-value{
margin-top:10px;
font-size:28px;
font-weight:bold;
color:#22c55e;
}

/* Section */

.section{
width:95%;
margin:20px auto;
}

.section-title{
font-size:20px;
font-weight:bold;
margin-bottom:15px;
color:#22c55e;
}

/* Search */

.searchBox{
width:100%;
padding:13px;
border:none;
border-radius:10px;
background:#1e293b;
color:#fff;
outline:none;
margin-bottom:15px;
}

/* Table */

.table{
background:#111827;
border-radius:15px;
overflow:hidden;
}

.table-head,
.table-row{
display:grid;
grid-template-columns:1.4fr 2fr 1fr 1fr 1.8fr;
gap:10px;
padding:14px;
align-items:center;
}

.table-head{
background:#1e293b;
color:#22c55e;
font-weight:bold;
}

.table-row{
border-top:1px solid #1f2937;
font-size:14px;
}

/* Buttons */

.btn{
padding:8px 12px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:13px;
font-weight:bold;
margin:2px;
}

.add{
background:#22c55e;
color:#fff;
}

.cut{
background:#f59e0b;
color:#fff;
}

.block{
background:#ef4444;
color:#fff;
}

.delete{
background:#7f1d1d;
color:#fff;
}

/* Popup */

.popup{
display:none;
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.7);
justify-content:center;
align-items:center;
z-index:9999;
}

.popup-box{
width:330px;
background:#111827;
padding:20px;
border-radius:15px;
}

.popup-box h3{
margin-bottom:15px;
}

.popup-box input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#1e293b;
color:#fff;
margin:12px 0;
outline:none;
}

.popup-box button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

/* Loader */

.loading{
display:none;
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
justify-content:center;
align-items:center;
z-index:99999;
}

.loader{
width:45px;
height:45px;
border-radius:50%;
border:4px solid #334155;
border-top:4px solid #22c55e;
animation:spin 1s linear infinite;
}

@keyframes spin{

100%{
transform:rotate(360deg);
}

}

@media(max-width:768px){

.dashboard{
grid-template-columns:1fr;
}

.table-head{
display:none;
}

.table-row{
display:block;
}

.table-row div{
margin:8px 0;
}

.logo{
font-size:18px;
}

}

</style>
</head>

<body>

<!-- Loading -->

<div class="loading" id="loading">

<div class="loader"></div>

</div>

<!-- Header -->

<div class="header">

<div class="logo">
👥 USER MANAGEMENT
</div>

</div>

<!-- Dashboard -->

<div class="dashboard">

<div class="card">

<div class="card-title">
Total Users
</div>

<div class="card-value"
id="totalUsers">
0
</div>

</div>

<div class="card">

<div class="card-title">
Blocked Users
</div>

<div class="card-value"
id="blockedUsers">
0
</div>

</div>

</div>

<!-- User List -->

<div class="section">

<h2 class="section-title">
All Users
</h2>

<input
type="text"
id="searchUser"
class="searchBox"
placeholder="Search Name / Email">

<div class="table">

<div class="table-head">

<div>Name</div>

<div>Email</div>

<div>Wallet</div>

<div>Status</div>

<div>Action</div>

</div>

<div id="usersTable">

</div>

</div>

</div>

<!-- Wallet Popup -->

<div class="popup"
id="balancePopup">

<div class="popup-box">

<h3 id="popupTitle">
Wallet Balance
</h3>

<input
type="number"
id="walletAmount"
placeholder="Enter Amount">

<button
style="background:#22c55e;color:#fff;"
onclick="saveWallet()">

Save

</button>

<button
style="background:#ef4444;color:#fff;"
onclick="closePopup()">

Cancel

</button>

</div>

</div>

<!-- Delete Popup -->

<div class="popup"
id="deletePopup">

<div class="popup-box">

<h3>
Delete User?
</h3>

<p style="margin-bottom:15px;color:#94a3b8;">

This action cannot be undone.

</p>

<button
style="background:#ef4444;color:#fff;"
onclick="deleteUser()">

Delete User

</button>

<button
style="background:#334155;color:#fff;"
onclick="closeDeletePopup()">

Cancel

</button>

</div>

</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
getDatabase,
ref,
onValue,
update,
remove,
get
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* Firebase Config */

const firebaseConfig = {

apiKey:"AIzaSyDsJUtZdIXcsB0w_2MQhMBXxIgbI3ijOvg",

authDomain:"incoinpaysliveearning.firebaseapp.com",

databaseURL:"https://incoinpaysliveearning-default-rtdb.firebaseio.com",

projectId:"incoinpaysliveearning",

storageBucket:"incoinpaysliveearning.firebasestorage.app",

messagingSenderId:"971873814750",

appId:"1:971873814750:web:7418c7da119e4725ed9a4f"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);

/* Admin UID */

const ADMIN_UID = "VIAP56vYwndWPhJxktn0lRPTWnS2";

/* Variables */

let selectedUID = "";
let walletAction = "";
let allUsers = [];

/* Admin Authentication */

onAuthStateChanged(auth,(user)=>{

if(!user){

location.href="admin.html";

return;

}

if(user.uid!==ADMIN_UID){

alert("Access Denied");

location.href="admin.html";

return;

}

/* Loading Hide */

document.getElementById("loading").style.display="none";

/* Load Data */

loadUsers();

});

/* Popup */

window.closePopup=function(){

document.getElementById("balancePopup").style.display="none";

}

window.closeDeletePopup=function(){

document.getElementById("deletePopup").style.display="none";

}
/* ===============================
   LOAD USERS
================================ */

function loadUsers(){

const table=document.getElementById("usersTable");

onValue(ref(db,"users"),(snap)=>{

table.innerHTML="";

allUsers=[];

let totalUsers=0;

let blockedUsers=0;

if(!snap.exists()){

table.innerHTML="<center style='padding:20px;'>No Users Found</center>";

return;

}

snap.forEach((child)=>{

const uid=child.key;

const data=child.val();

const user={

uid:uid,

name:data.name||"No Name",

email:data.email||"-",

wallet:Number(data.wallet||0),

blocked:data.blocked===true

};

allUsers.push(user);

totalUsers++;

if(user.blocked){

blockedUsers++;

}

});

document.getElementById("totalUsers").innerText=totalUsers;

document.getElementById("blockedUsers").innerText=blockedUsers;

renderUsers(allUsers);

});

}

/* ===============================
   RENDER USERS
================================ */

function renderUsers(users){

const table=document.getElementById("usersTable");

table.innerHTML="";

users.forEach((user)=>{

table.innerHTML+=`

<div class="table-row">

<div>${user.name}</div>

<div>${user.email}</div>

<div>₹${Math.floor(user.wallet)}</div>

<div>

${user.blocked
? "<span style='color:#ef4444'>Blocked</span>"
: "<span style='color:#22c55e'>Active</span>"}

</div>

<div>

<button class="btn add"

onclick="openAddBalance('${user.uid}')">

Add

</button>

<button class="btn cut"

onclick="openCutBalance('${user.uid}')">

Cut

</button>

<button class="btn block"

onclick="toggleBlock('${user.uid}',${user.blocked})">

${user.blocked ? "Unblock" : "Block"}

</button>

<button class="btn delete"

onclick="openDeletePopup('${user.uid}')">

Delete

</button>

</div>

</div>

`;

});

}
/* ===============================
   SEARCH USER
================================ */

document.getElementById("searchUser").addEventListener("input",function(){

const keyword=this.value.toLowerCase().trim();

if(keyword===""){

renderUsers(allUsers);

return;

}

const result=allUsers.filter(user=>{

return(

user.name.toLowerCase().includes(keyword) ||

user.email.toLowerCase().includes(keyword) ||

user.uid.toLowerCase().includes(keyword)

);

});

renderUsers(result);

});

/* ===============================
   OPEN ADD BALANCE
================================ */

window.openAddBalance=function(uid){

selectedUID=uid;

walletAction="add";

document.getElementById("popupTitle").innerText="Add Wallet Balance";

document.getElementById("walletAmount").value="";

document.getElementById("balancePopup").style.display="flex";

}

/* ===============================
   OPEN CUT BALANCE
================================ */

window.openCutBalance=function(uid){

selectedUID=uid;

walletAction="cut";

document.getElementById("popupTitle").innerText="Cut Wallet Balance";

document.getElementById("walletAmount").value="";

document.getElementById("balancePopup").style.display="flex";

}

/* ===============================
   SAVE WALLET
================================ */

window.saveWallet = async function () {

    try {

        const amount = Number(document.getElementById("walletAmount").value);

        if (!selectedUID) {
            alert("User not selected");
            return;
        }

        if (isNaN(amount) || amount <= 0) {
            alert("Enter valid amount");
            return;
        }

        const userRef = ref(db, "users/" + selectedUID);

        const snap = await get(userRef);

        if (!snap.exists()) {
            alert("User not found");
            return;
        }

        const data = snap.val();

        let wallet = Number(data.wallet || 0);

        if (walletAction === "add") {

            wallet = wallet + amount;

        } else if (walletAction === "cut") {

            if (wallet < amount) {
                alert("Insufficient Wallet Balance");
                return;
            }

            wallet = wallet - amount;

        } else {

            alert("Invalid Action");
            return;

        }

        await update(userRef, {
            wallet: wallet
        });

        alert("Wallet Updated Successfully");

        document.getElementById("walletAmount").value = "";

        document.getElementById("balancePopup").style.display = "none";

        selectedUID = "";
        walletAction = "";

    } catch (error) {

        console.error(error);

        alert("Error : " + error.message);

    }

};
/* ===============================
   BLOCK / UNBLOCK USER
================================ */

window.toggleBlock = async function(uid, blocked){

try{

await update(ref(db,"users/"+uid),{

blocked: !blocked

});

alert(blocked ? "User Unblocked" : "User Blocked");

}catch(err){

alert(err.message);

}

};

/* ===============================
   DELETE POPUP
================================ */

window.openDeletePopup=function(uid){

selectedUID=uid;

document.getElementById("deletePopup").style.display="flex";

}

/* ===============================
   DELETE USER
================================ */

window.deleteUser=async function(){

if(selectedUID===""){

alert("User Not Selected");

return;

}

if(!confirm("Are you sure you want to delete this user?")){

return;

}

try{

await remove(ref(db,"users/"+selectedUID));

alert("User Deleted Successfully");

closeDeletePopup();

selectedUID="";

}catch(err){

alert(err.message);

}

};

/* ===============================
   CLOSE POPUP ON OUTSIDE CLICK
================================ */

document.getElementById("balancePopup").addEventListener("click",function(e){

if(e.target.id==="balancePopup"){

closePopup();

}

});

document.getElementById("deletePopup").addEventListener("click",function(e){

if(e.target.id==="deletePopup"){

closeDeletePopup();

}

});
/* ===============================
   ESC KEY CLOSE POPUPS
================================ */

document.addEventListener("keydown",function(e){

if(e.key==="Escape"){

closePopup();

closeDeletePopup();

}

});

/* ===============================
   PREVENT NEGATIVE VALUE
================================ */

document.getElementById("walletAmount").addEventListener("input",function(){

if(Number(this.value)<0){

this.value="";

}

});

/* ===============================
   AUTO HIDE LOADER
================================ */

window.addEventListener("load",function(){

document.getElementById("loading").style.display="none";

});

/* ===============================
   REFRESH USERS
================================ */

window.refreshUsers=function(){

loadUsers();

};

</script>

</body>

</html>
