<!-- ==========================
PART 3
FIREBASE CONNECT + MATCH LOAD
========================== -->

<script type="module">

import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";


import {
getDatabase,
ref,
onValue,
set,
get
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";





const firebaseConfig={


apiKey:"AIzaSyDsJUtZdIXcsB0w_2MQhMBXxIgbI3ijOvg",

authDomain:"incoinpaysliveearning.firebaseapp.com",

databaseURL:"https://incoinpaysliveearning-default-rtdb.firebaseio.com",

projectId:"incoinpaysliveearning",

storageBucket:"incoinpaysliveearning.firebasestorage.app",

messagingSenderId:"971873814750",

appId:"1:971873814750:web:7418c7da119e4725ed9a4f"


};





const app = initializeApp(firebaseConfig);


const auth=getAuth(app);


const db=getDatabase(app);



window.db=db;



let user=null;



// GET MATCH ID

const params=new URLSearchParams(location.search);


const matchId=params.get("id");


window.matchId=matchId;




if(!matchId){

alert("Match Not Found");

location.href="dashboard.html";

}




// LOGIN CHECK


onAuthStateChanged(auth,(u)=>{


if(!u){

location.href="index.html";

return;

}


user=u;


window.currentUser=u;



loadMatch();


loadPlayers();


});






// LOAD MATCH DETAILS


function loadMatch(){



onValue(

ref(db,"matches/"+matchId),

(snapshot)=>{


if(!snapshot.exists()) return;



const m=snapshot.val();



const img = document.getElementById("matchImage");


if(m.image){

let imageUrl = m.image;


// Pexels page link convert

if(imageUrl.includes("pexels.com/photo/")){

let id = imageUrl
.split("-")
.pop()
.replace("/","");


imageUrl =
"https://images.pexels.com/photos/"
+id+
"/pexels-photo-"
+id+
".jpeg";

}


img.src = imageUrl;


img.onerror=function(){

img.src="https://via.placeholder.com/700x350";

};


}
else{

img.src="https://via.placeholder.com/700x350";

}


document.getElementById("matchTitle").innerHTML =

m.title || "BGMI MATCH";




document.getElementById("mode").innerHTML =

(m.type || "SQUAD").toUpperCase();




document.getElementById("date").innerHTML =

m.date || "-";




document.getElementById("time").innerHTML =

m.time || "-";




document.getElementById("prize").innerHTML =

"₹"+(m.prize || 0);




document.getElementById("entry").innerHTML =

"₹"+(m.entry || 0);




document.getElementById("slots").innerHTML =

(m.booked || 0)+"/"+(m.total || 0);






});



}









// LOAD JOINED PLAYERS


function loadPlayers(){



onValue(

ref(db,"matchPlayers/"+matchId),

(snapshot)=>{


const box=document.getElementById("playerList");


box.innerHTML="";



if(!snapshot.exists()){


box.innerHTML="No Players Joined";

return;

}




let no=1;



snapshot.forEach((item)=>{


let p=item.val();



box.innerHTML+=`


<div class="player">


<div>

<b>${no++}. ${p.name || "Player"}</b>

<br>

<small>${p.bgmiId || "-"}</small>

</div>


<div class="badge">

JOINED

</div>


</div>


`;



});




});



}







// JOIN BUTTON


document.getElementById("joinBtn").onclick=async()=>{


if(!user){

alert("Login Required");

return;

}




const userSnap=await get(

ref(db,"users/"+user.uid)

);



if(!userSnap.exists()) return;



const u=userSnap.val();



const matchSnap=await get(

ref(db,"matches/"+matchId)

);



const match=matchSnap.val();





// CHECK ALREADY JOIN


const already=await get(

ref(db,"matchPlayers/"+matchId+"/"+user.uid)

);



if(already.exists()){


alert("Already Joined");

return;

}






// WALLET CHECK


if(Number(u.wallet || 0) < Number(match.entry || 0)){


alert("Insufficient Wallet Balance");

return;


}






// ADD PLAYER
await set(
ref(db,"matchPlayers/"+matchId+"/"+user.uid),
{
uid:user.uid,
name:u.name || "Player",
bgmiId:u.bgmiId || "-",
joinedAt:Date.now()
}
);


// DEDUCT WALLET
await set(
ref(db,"users/"+user.uid+"/wallet"),
Number(u.wallet)-Number(match.entry)
);


// UPDATE BOOKED
await set(
ref(db,"matches/"+matchId+"/booked"),
Number(match.booked || 0)+1
);


// SUCCESS
alert("Match Joined Successfully");

document.getElementById("joinBtn").style.display="none";

openRoom(match);



};





</script>

SECURE ROOM ACCESS FIX
========================== -->

<script type="module">


import {
ref,
onValue
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";



const ADMIN_UID =
"VIAP56vYwndWPhJxktn0lRPTWnS2";




function checkRoomAccess(){



const db = window.db;

const matchId = window.matchId;



if(!db || !matchId || !window.currentUser){


setTimeout(checkRoomAccess,1000);

return;

}




const uid = window.currentUser.uid;






onValue(

ref(db,"matches/"+matchId),

(matchSnap)=>{


if(!matchSnap.exists()) return;



const match = matchSnap.val();






// GROUP LINK AVAILABLE CHECK

if(!match.groupLink){

document.getElementById("roomLocked").style.display="block";
document.getElementById("roomData").style.display="none";

document.getElementById("roomLocked").innerHTML=`

🔒 first join match

`;

return;

}







// ADMIN ACCESS


if(uid === ADMIN_UID){


openRoom(match);


return;


}








// PLAYER CHECK


onValue(

ref(db,"matchPlayers/"+matchId+"/"+uid),

(player)=>{


if(player.exists()){

openRoom(match);

}else{

document.getElementById("roomLocked").style.display="block";
document.getElementById("roomData").style.display="none";

document.getElementById("roomLocked").innerHTML=`
⚠️ Aapne ye match join nahi kiya hai.
<br><br>
Room details sirf joined players ke liye hai.
`;

}


}



);



}



);

}


function openRoom(match){

const lock =
document.getElementById("roomLocked");

const data =
document.getElementById("roomData");


if(!lock || !data) return;


lock.style.display="none";

data.style.display="block";


const link =
document.getElementById("groupLink");


if(match.groupLink){

link.href = match.groupLink;

link.innerHTML="Join id pass Group";

}

else{

link.href="#";

link.innerHTML="Group Link Not Added";

}


}


setTimeout(()=>{


checkRoomAccess();


},2000);




</script>
