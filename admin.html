<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BGMI Admin Login</title>

<style>

*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#080808;
  color:white;
}


.card{

  width:90%;
  max-width:400px;
  background:#121421;
  padding:25px;
  border-radius:18px;
  box-shadow:0 0 20px #000;

}


h2{

 text-align:center;
 color:#FFD700;
 margin-bottom:25px;

}


.input{

 width:100%;
 padding:13px;
 margin-bottom:15px;
 border-radius:12px;
 border:none;
 outline:none;
 font-size:16px;

}


button{

 width:100%;
 padding:14px;
 border:none;
 border-radius:12px;
 background:#FFD700;
 color:#000;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;

}


button:hover{

 opacity:.8;

}


.msg{

 text-align:center;
 margin-top:15px;
 font-size:14px;

}


.error{

 color:#ff5c5c;

}


.success{

 color:#00ff88;

}


</style>

</head>


<body>


<div class="card">

<h2>🔥 BGMI ADMIN LOGIN</h2>


<input 
type="email"
id="email"
class="input"
placeholder="Enter Admin Email">


<input 
type="password"
id="password"
class="input"
placeholder="Enter Password">


<button onclick="loginAdmin()">
LOGIN
</button>


<div id="msg" class="msg"></div>


</div>





<!-- Firebase SDK -->

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>



<script>


// Firebase Config

const firebaseConfig = {

apiKey: "AIzaSyDsJUtZdIXcsB0w_2MQhMBXxIgbI3ijOvg",

authDomain: "incoinpaysliveearning.firebaseapp.com",

databaseURL: "https://incoinpaysliveearning-default-rtdb.firebaseio.com",

projectId: "incoinpaysliveearning",

storageBucket: "incoinpaysliveearning.appspot.com",

messagingSenderId: "971873814750",

appId: "1:971873814750:web:7418c7da119e4725ed9a4f"

};


firebase.initializeApp(firebaseConfig);


const auth = firebase.auth();



// 👑 ADMIN UID YAHAN DALE

const ADMIN_UID = "VIAP56vYwndWPhJxktn0lRPTWnS";





function loginAdmin(){


let email = document.getElementById("email").value.trim();

let password = document.getElementById("password").value.trim();

let msg = document.getElementById("msg");


msg.innerHTML="";



if(email=="" || password==""){

msg.innerHTML="<span class='error'>❌ Email & Password Required</span>";

return;

}



auth.signInWithEmailAndPassword(email,password)

.then((result)=>{


let user = result.user;



// ADMIN CHECK

if(user.uid === ADMIN_UID){


msg.innerHTML="<span class='success'>✅ Login Successful</span>";



setTimeout(()=>{


window.location.href="user.html";


},1000);



}

else{


msg.innerHTML="<span class='error'>❌ You are not Admin</span>";

auth.signOut();


}



})


.catch((error)=>{


msg.innerHTML="<span class='error'>❌ "+error.message+"</span>";


});



}


</script>


</body>
</html>
