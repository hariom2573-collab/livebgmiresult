<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile</title>

<style>

/* ===============================
   GLOBAL STYLE
================================ */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(180deg,#020617,#0f172a);
  color:#fff;
  overflow-x:hidden;
  padding-bottom:90px;
}

/* ===============================
   HEADER
================================ */

.header{
  padding:18px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  color:#22c55e;
  letter-spacing:.5px;
}

/* ===============================
   PROFILE CARD
================================ */

.profile-card{
  width:92%;
  max-width:420px;
  margin:18px auto;
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(12px);
  border:1px solid rgba(34,197,94,.15);
  border-radius:20px;
  padding:22px;
  text-align:center;
  box-shadow:0 0 25px rgba(34,197,94,.18);
}

.avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #22c55e;
  margin-bottom:12px;
}

.username{
  font-size:18px;
  font-weight:bold;
}

.badge{
  display:none;
  margin-left:8px;
  background:linear-gradient(90deg,#FFD700,#F59E0B);
  color:#000;
  padding:4px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.uid{
  margin-top:8px;
  font-size:11px;
  opacity:.7;
  word-break:break-all;
}

/* ===============================
   INFO SECTION
================================ */

.info{
  width:92%;
  max-width:420px;
  margin:15px auto;
}

.info-card{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(34,197,94,.12);
  border-radius:16px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 0 12px rgba(34,197,94,.12);
}

.label{
  font-size:12px;
  color:#94a3b8;
}

.value{
  margin-top:6px;
  font-size:19px;
  font-weight:bold;
  color:#fff;
}

/* ===============================
   HEADER
================================ */

.header{
  padding:18px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  color:#22c55e;
}

/* ===============================
   PROFILE CARD
================================ */

.profile-card{
  margin:15px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
  padding:20px;
  border-radius:18px;
  box-shadow:0 0 20px rgba(34,197,94,0.2);
  text-align:center;
}

.avatar{
  width:80px;
  height:80px;
  border-radius:50%;
  border:3px solid #22c55e;
  margin-bottom:10px;
}

.username{
  font-size:16px;
  font-weight:bold;
}

.badge{
  background:gold;
  color:black;
  font-size:11px;
  padding:3px 8px;
  border-radius:20px;
  font-weight:bold;
  display:none;
  margin-left:6px;
}

.uid{
  font-size:11px;
  opacity:.6;
  margin-top:5px;
  word-break:break-all;
}

/* ===============================
   INFO CARDS
================================ */

.info{
  margin:15px;
}

.info-card{
  background:rgba(255,255,255,0.05);
  padding:15px;
  border-radius:15px;
  margin-bottom:12px;
  box-shadow:0 0 15px rgba(34,197,94,0.15);
}

.label{
  font-size:12px;
  opacity:.6;
}

.value{
  font-size:18px;
  font-weight:bold;
  margin-top:4px;
}

/* ===============================
   BUTTONS
================================ */

.btn{
  width:92%;
  max-width:420px;
  margin:10px auto;
  display:block;
  padding:14px;
  border:none;
  border-radius:30px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  transition:.25s;
}

.btn:hover{
  transform:translateY(-2px);
}

.copy{
  background:#1e293b;
  color:#22c55e;
}

.copy:hover{
  background:#334155;
}

.logout{
  background:#dc2626;
  color:#fff;
}

.logout:hover{
  background:#b91c1c;
}

/* ===============================
   LOADING
================================ */

#loading{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.6);
  z-index:9999;
}

.loader{
  width:42px;
  height:42px;
  border:4px solid #1e293b;
  border-top:4px solid #22c55e;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

/* ===============================
   BOTTOM NAVIGATION
================================ */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:70px;
  background:#0f172a;
  border-top:1px solid #1e293b;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  align-items:center;
  z-index:100;
}

.nav-btn{
  text-align:center;
  color:#64748b;
  font-size:12px;
  cursor:pointer;
  transition:.25s;
  user-select:none;
}

.nav-btn:hover{
  color:#22c55e;
}

.nav-btn.active{
  color:#22c55e;
  font-weight:bold;
}

.nav-btn.active::after{
  content:"";
  display:block;
  width:22px;
  height:3px;
  margin:5px auto 0;
  background:#22c55e;
  border-radius:20px;
}

/* ===============================
   MOBILE RESPONSIVE
================================ */

@media (max-width:480px){

.header{
  font-size:20px;
}

.profile-card{
  padding:18px;
}

.avatar{
  width:80px;
  height:80px;
}

.value{
  font-size:17px;
}

.btn{
  font-size:14px;
  padding:12px;
}

.bottom-nav{
  height:65px;
}

.nav-btn{
  font-size:11px;
}

}

</style>
</head>

<body>

<div class="header">👤 My Profile</div>

<div class="profile-card">

    <img
        id="avatar"
        src="https://i.pravatar.cc/150"
        class="avatar">

    <div class="username">

        <span id="email">
            Loading...
        </span>

        <span
            class="badge"
            id="premiumBadge">
            👑 PREMIUM
        </span>

    </div>

    <div
        class="uid"
        id="uidText">
        UID Loading...
    </div>

</div>

<div class="info">

    <div class="info-card">
        <div class="label">
            Wallet Balance
        </div>
        <div
            class="value"
            id="wallet">
            ₹ 0
        </div>
    </div>

    <div class="info-card">
        <div class="label">
            Bonus Balance
        </div>
        <div
            class="value"
            id="bonus">
            ₹ 0
        </div>
    </div>

    <div class="info-card">
        <div class="label">
            Withdrawable Balance
        </div>
        <div
            class="value"
            id="withdraw">
            ₹ 0
        </div>
    </div>

    <div class="info-card">
        <div class="label">
            Member Since
        </div>
        <div
            class="value"
            id="memberSince">
            --
        </div>
    </div>

    <div class="info-card">
        <div class="label">
            Last Login
        </div>
        <div
            class="value"
            id="lastLogin">
            --
        </div>
    </div>

    <div class="info-card">
        <div class="label">
            Matches Played
        </div>
        <div
            class="value"
            id="matches">
            0
        </div>
    </div>

    <div class="info-card">
        <div class="label">
            Chicken Dinner
        </div>
        <div
            class="value"
            id="wins">
            0
        </div>
    </div>

    <div class="info-card">
        <div class="label">
            Referral Code
        </div>
        <div
            class="value"
            id="refCode">
            --
        </div>
    </div>

    <div class="info-card">
        <div class="label">
            FCM Token
        </div>

        <div
            class="value"
            id="fcmToken"
            style="font-size:10px;word-break:break-all;">
            Not Available
        </div>

    </div>

</div>


<!-- ACTION BUTTONS -->

<button class="btn copy" onclick="copyUID()">
    📋 Copy UID
</button>

<button class="btn copy" onclick="copyEmail()">
    📧 Copy Email
</button>

<button class="btn copy" onclick="goPage('edit-profile.html')">
    ✏️ Edit Profile
</button>

<button class="btn logout" onclick="logout()">
    🚪 Logout
</button>

<!-- LOADING -->

<div id="loading">
    <div class="loader"></div>
</div>

<!-- BOTTOM NAVIGATION -->

<div class="bottom-nav">

    <div class="nav-btn"
         onclick="goPage('dashboard.html')">
        🏠<br>Home
    </div>

    <div class="nav-btn"
         onclick="goPage('wallet.html')">
        💰<br>Wallet
    </div>

    <div class="nav-btn"
         onclick="goPage('history.html')">
        📜<br>History
    </div>

    <div class="nav-btn active">
        👤<br>Profile
    </div>

</div>

<!-- FIREBASE SCRIPT -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
    getDatabase,
    ref,
    onValue
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {

    apiKey:"AIzaSyDsJUtZdIXcsB0w_2MQhMBXxIgbI3ijOvg",

    authDomain:"incoinpaysliveearning.firebaseapp.com",

    databaseURL:"https://incoinpaysliveearning-default-rtdb.firebaseio.com",

    projectId:"incoinpaysliveearning",

    storageBucket:"incoinpaysliveearning.firebasestorage.app",

    messagingSenderId:"971873814750",

    appId:"1:971873814750:web:7418c7da119e4725ed9a4f"

};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const loading=document.getElementById("loading");

onAuthStateChanged(auth,(user)=>{

  if(!user){
    window.location.href="index.html";
    return;
  }

  loading.style.display="flex";

  document.getElementById("email").innerText=user.email;
  document.getElementById("uidText").innerText="UID: "+user.uid;

  onValue(ref(db,"users/"+user.uid),(snap)=>{

    if(!snap.exists()) return;

    const data=snap.val();

    document.getElementById("wallet").innerText="₹ "+(data.wallet||0);
    document.getElementById("bonus").innerText="₹ "+(data.bonus||0);
    document.getElementById("withdraw").innerText="₹ "+(data.withdrawable||0);
    document.getElementById("fcmToken").innerText=data.fcmToken||"Not Available";

    if(data.premium===true){
      document.getElementById("premiumBadge").style.display="inline-block";
    }

    loading.style.display="none";

  });

});

window.logout=function(){
  signOut(auth).then(()=>{
    window.location.href="index.html";
  });
}

window.copyUID=function(){
  const uid=document.getElementById("uidText").innerText;
  navigator.clipboard.writeText(uid);
  alert("UID Copied!");
}

window.goPage=function(page,el){
  setTimeout(()=>{window.location.href=page},150);
}

</script>

</body>
</html>
