<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>My Profile</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,Arial,sans-serif;
}

body{

background:#07111d;
color:#fff;
overflow-x:hidden;
padding-bottom:90px;

}

body::-webkit-scrollbar{

display:none;

}

/* Header */

.header{

padding:18px;
text-align:center;
font-size:24px;
font-weight:700;
color:#22c55e;

}

/* Profile Card */

.profile-card{

width:92%;
max-width:420px;
margin:18px auto;
padding:25px;
border-radius:24px;
background:linear-gradient(135deg,#111827,#1f2937);
box-shadow:0 10px 30px rgba(0,0,0,.35);
text-align:center;

}

.username{

margin-top:15px;
font-size:24px;
font-weight:bold;

}

.badge{

display:none;
margin-top:10px;
padding:6px 16px;
background:#FFD700;
color:#000;
font-size:12px;
font-weight:bold;
border-radius:30px;

}

.player-name{

margin-top:10px;
font-size:14px;
color:#94a3b8;

}

/* Wallet */

.info{

width:92%;
max-width:420px;
margin:20px auto;

}

.info-card{

background:#111827;
padding:18px;
border-radius:18px;
box-shadow:0 5px 20px rgba(0,0,0,.25);

}

.label{

font-size:13px;
color:#94a3b8;

}

.value{

margin-top:8px;
font-size:28px;
font-weight:bold;

}

/* Logout */

.btn{

width:92%;
max-width:420px;
height:52px;
margin:20px auto;
display:block;
border:none;
border-radius:14px;
background:#dc2626;
color:#fff;
font-size:16px;
font-weight:bold;
cursor:pointer;

}

.btn:hover{

background:#b91c1c;

}

/* Loading */

#loading{

position:fixed;
inset:0;
background:#07111d;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;

}

.loader{

width:55px;
height:55px;
border:5px solid #1f2937;
border-top:5px solid #22c55e;
border-radius:50%;
animation:spin .8s linear infinite;

}

@keyframes spin{

100%{

transform:rotate(360deg);

}

}

/* Bottom Nav */

.bottom-nav{

position:fixed;
left:0;
bottom:0;
width:100%;
height:72px;
background:#111827;
display:flex;
justify-content:space-around;
align-items:center;
border-top:1px solid rgba(255,255,255,.08);

}

.nav-btn{

text-align:center;
font-size:12px;
color:#94a3b8;
cursor:pointer;

}

.nav-btn.active{

color:#22c55e;

}

.nav-icon{

font-size:22px;
margin-bottom:4px;

}

</style>

</head>

<body>

<div id="loading">

<div class="loader"></div>

</div>

<div class="header">

👤 My Profile

</div>

<div class="profile-card">

<div
class="username"
id="userName">

Loading...

</div>

<div
class="badge"
id="premiumBadge">

👑 PREMIUM

</div>

<div
class="player-name"
id="playerName">

Loading...

</div>

</div>

<div class="info">

<div class="info-card">

<div class="label">

Wallet Balance

</div>

<div
class="value"
id="wallet">

₹0

</div>

</div>

</div>

<button
class="btn"
onclick="logout()">

🚪 Logout

</button>

<div class="bottom-nav">

<div
class="nav-btn"
onclick="location.href='dashboard.html'">

<div class="nav-icon">

🏠

</div>

Home

</div>

<div
class="nav-btn"
onclick="location.href='wallet.html'">

<div class="nav-icon">

💳

</div>

Wallet

</div>

<div
class="nav-btn"
onclick="location.href='history.html'">

<div class="nav-icon">

📜

</div>

History

</div>

<div class="nav-btn active">

<div class="nav-icon">

👤

</div>

Profile

</div>

</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
getDatabase,
ref,
onValue
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig={

apiKey:"AIzaSyDsJUtZdIXcsB0w_2MQhMBXxIgbI3ijOvg",

authDomain:"incoinpaysliveearning.firebaseapp.com",

databaseURL:"https://incoinpaysliveearning-default-rtdb.firebaseio.com",

projectId:"incoinpaysliveearning",

storageBucket:"incoinpaysliveearning.firebasestorage.app",

messagingSenderId:"971873814750",

appId:"1:971873814750:web:7418c7da119e4725ed9a4f"

};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getDatabase(app);

const loading=document.getElementById("loading");
const userName=document.getElementById("userName");
const playerName=document.getElementById("playerName");
const wallet=document.getElementById("wallet");
const premiumBadge=document.getElementById("premiumBadge");


onAuthStateChanged(auth,(user)=>{

if(!user){

location.href="index.html";
return;

}

onValue(ref(db,"users/"+user.uid),(snap)=>{

loading.style.display="none";

if(!snap.exists()){

userName.innerHTML="Player";
playerName.innerHTML="Welcome Player";
wallet.innerHTML="₹0";

return;

}

const data=snap.val();

/* Name */

userName.innerHTML=data.name || "Player";

/* UID ki jagah Name */

playerName.innerHTML=data.name || "Player";

/* Wallet */

wallet.innerHTML="₹ "+Number(data.wallet||0).toLocaleString("en-IN",{
maximumFractionDigits:2
});

/* Premium */

if(data.premium===true){

premiumBadge.style.display="inline-block";

}else{

premiumBadge.style.display="none";

}

});

});


window.logout=function(){

if(confirm("Are you sure you want to logout?")){

signOut(auth).then(()=>{

location.href="index.html";

});

}

};

</script>

</body>
</html>
