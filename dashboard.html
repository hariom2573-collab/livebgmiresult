<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<meta name="theme-color" content="#050B18">

<title>BGMI ESPORTS</title>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
-webkit-tap-highlight-color:transparent;
}


body{

background:#050B18;
color:white;
overflow-x:hidden;

}


body::before{

content:"";

position:fixed;

inset:0;

background:

radial-gradient(circle at top left,
rgba(34,197,94,.20),
transparent 35%),


radial-gradient(circle at top right,
rgba(37,99,235,.20),
transparent 35%),


#050B18;

z-index:-1;

}



.app{

width:100%;
max-width:500px;
margin:auto;

padding-bottom:100px;

}




/* HEADER */


.header{

display:flex;

justify-content:space-between;

align-items:center;

padding:18px;

}




.userBox{

display:flex;

align-items:center;

}



.userInfo h2{

font-size:22px;

font-weight:800;

}



.userInfo p{

font-size:12px;

color:#94a3b8;

}




.walletBox{


background:#111827;

padding:10px 18px;

border-radius:25px;

border:1px solid rgba(255,255,255,.1);

color:#22c55e;

font-weight:800;

}






/* CATEGORY */


.categoryBar{

display:flex;

gap:10px;

padding:0 18px 18px;

overflow-x:auto;

}


.categoryBar::-webkit-scrollbar{

display:none;

}



.categoryBtn{


padding:10px 20px;

border:none;

border-radius:30px;

background:#111827;

color:white;

font-weight:700;

}



.categoryBtn.active{


background:#22c55e;

color:#000;

}





.sectionTitle{

padding:0 18px;

font-size:22px;

margin-bottom:10px;

}





/* MATCH CARD */


.match-card{


margin:18px;

background:#111827;

border-radius:22px;

overflow:hidden;

border:1px solid rgba(255,255,255,.08);


}



.match-image{


height:190px;

position:relative;


}



.match-image img{


width:100%;

height:100%;

object-fit:cover;


}




.mode{


position:absolute;

top:12px;

left:12px;


background:#22c55e;

color:#000;

padding:6px 14px;

border-radius:20px;

font-size:12px;

font-weight:800;

}



.status{


position:absolute;

top:12px;

right:12px;


background:#0009;

padding:6px 12px;

border-radius:20px;

font-size:12px;


}




.overlay{


position:absolute;

bottom:0;

left:0;

right:0;


padding:18px;


background:linear-gradient(
transparent,
#000
);


}



.overlay h1{

font-size:22px;

}



.overlay p{

color:#cbd5e1;

font-size:13px;

}





.match-info{


display:flex;

padding:18px;

}



.info-box{


flex:1;

text-align:center;


}



.info-box span{


font-size:11px;

color:#94a3b8;


}



.info-box h2{


margin-top:5px;

font-size:19px;

color:#22c55e;


}





.progress{


height:8px;

background:#1f2937;

margin:0 18px 18px;

border-radius:20px;

overflow:hidden;


}



.progress-fill{


height:100%;

background:#22c55e;


}



/* BOTTOM NAV */


.bottomNav{


position:fixed;

bottom:0;

left:0;

right:0;

height:75px;


max-width:500px;

margin:auto;


background:#111827;


border-top:1px solid rgba(255,255,255,.1);


display:flex;

justify-content:space-around;

align-items:center;


z-index:999;


}




.navBtn{


flex:1;

height:100%;


background:none;

border:none;


color:#94a3b8;

font-size:12px;

font-weight:700;


}




.navBtn span{


display:block;

font-size:24px;

margin-bottom:3px;


}



.navBtn.active{


color:#22c55e;


}
.bgImage{

position:fixed;
inset:0;

background-image:url("https://images.pexels.com/photos/17681813/pexels-photo-17681813.jpeg");

background-size:cover;
background-position:center;

opacity:0.20;

z-index:-2;

}


.bgOverlay{

position:fixed;
inset:0;

background:rgba(5,11,24,0.85);

z-index:-1;

}


</style>


</head>
<!-- Welcome Popup -->
<div id="welcomePopup" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.75);
z-index:99999;
justify-content:center;
align-items:center;
">

<div style="
width:90%;
max-width:350px;
background:#111827;
padding:25px;
border-radius:18px;
text-align:center;
border:2px solid #22c55e;
">

<h2 style="color:#22c55e;margin-bottom:10px;">
🎉 Welcome
</h2>

<p style="color:#fff;font-size:15px;line-height:24px;">
Welcome to <b>BGMI ESPORTS</b><br><br>
Register for tournaments, win exciting prizes and enjoy your gaming journey.
</p>

<button onclick="closeWelcome()" style="
margin-top:20px;
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#22c55e;
color:#000;
font-weight:700;
font-size:16px;
cursor:pointer;
">
Let's Go 🚀
</button>

</div>
</div>

<body>

<div class="bgImage"></div>
<div class="bgOverlay"></div>


<div class="app">



<!-- HEADER -->


<div class="header">

    <div class="userBox">
        <div class="userInfo">
            <h2 id="playerName"></h2>
         
        </div>
    </div>

    <div style="display:flex;align-items:center;gap:10px;">

        <button onclick="location.href='help.html'" style="
        background:#111827;
        color:#22c55e;
        border:1px solid rgba(255,255,255,.1);
        border-radius:25px;
        padding:10px 16px;
        font-weight:700;
        cursor:pointer;">
            Help
        </button>

        <div class="walletBox">
            ₹<span id="walletAmount">0</span>
        </div>

    </div>

</div>

<!-- CATEGORY -->


<div class="categoryBar">

<button class="categoryBtn active" onclick="filterMatches('all',this)">
ALL
</button>

<button class="categoryBtn" onclick="filterMatches('solo',this)">
SOLO
</button>

<button class="categoryBtn" onclick="filterMatches('duo',this)">
DUO
</button>

<button class="categoryBtn" onclick="filterMatches('squad',this)">
SQUAD
</button>

<button class="categoryBtn" onclick="filterMatches('tdm',this)">
TDM
</button>

</div>




<h2 class="sectionTitle">

🔥 Upcoming Matches

</h2>



<div id="matchesContainer">

</div>



</div>
<!-- ==========================
PART 2
FIREBASE + USER + WALLET + MATCH LOAD
========================== -->


<script type="module">


import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";



import {

getAuth,

onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";



import {

getDatabase,

ref,

onValue

}

from

"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";





// FIREBASE CONFIG


const firebaseConfig = {


apiKey:"AIzaSyDsJUtZdIXcsB0w_2MQhMBXxIgbI3ijOvg",

authDomain:"incoinpaysliveearning.firebaseapp.com",

databaseURL:"https://incoinpaysliveearning-default-rtdb.firebaseio.com",

projectId:"incoinpaysliveearning",

storageBucket:"incoinpaysliveearning.firebasestorage.app",

messagingSenderId:"971873814750",

appId:"1:971873814750:web:7418c7da119e4725ed9a4f"


};





const app = initializeApp(firebaseConfig);


const auth = getAuth(app);


const db = getDatabase(app);



window.auth = auth;

window.db = db;





let currentUID = "";





// LOGIN CHECK FIX


onAuthStateChanged(auth,(user)=>{


if(user){


currentUID = user.uid;



console.log("LOGIN UID :",currentUID);



loadUser(currentUID);


loadMatches();



}

else{


setTimeout(()=>{


if(!auth.currentUser){


location.replace("index.html");


}


},3000);


}



});








// LOAD USER NAME + WALLET


function loadUser(uid){



onValue(

ref(db,"users/"+uid),

(snapshot)=>{



if(!snapshot.exists()){


document.getElementById("playerName").innerHTML="Player";


return;


}



const data = snapshot.val();





document.getElementById("playerName").innerHTML =

data.name || "Player";





document.getElementById("walletAmount").innerHTML =

Math.floor(data.wallet || 0);




}



);



}









// LOAD MATCHES


function loadMatches(){



onValue(

ref(db,"matches"),

(snapshot)=>{


const box =
document.getElementById("matchesContainer");



box.innerHTML="";




if(!snapshot.exists()){


box.innerHTML=`

<div style="
padding:40px;
text-align:center;
color:#94a3b8">

No Upcoming Matches

</div>

`;

return;


}





snapshot.forEach((child)=>{



const id = child.key;


const match = child.val();
let imageUrl = match.image || "";

if (imageUrl.includes("pexels.com/photo/")) {

    const matchId = imageUrl.match(/photo\/(?:.*-)?(\d+)\/?$/);

    if (matchId) {
        imageUrl = `https://images.pexels.com/photos/${matchId[1]}/pexels-photo-${matchId[1]}.jpeg`;
    }

}


let booked =

Number(match.booked || 0);



let total =

Number(match.total || 25);



let percent =

(total>0)

?

(booked/total)*100

:

0;





let timer="";



if(match.date && match.time){


let start = new Date(

match.date+" "+match.time

);


let now = new Date();


let diff = start-now;



if(diff>0){


let h=Math.floor(diff/3600000);


let m=Math.floor(
(diff%3600000)/60000
);



timer =
"⏰ "+h+"h "+m+"m";


}

else{


timer="Started";


}


}





box.innerHTML +=`


<div class="match-card"
data-mode="${(match.type || 'SQUAD').toLowerCase()}"
onclick="openMatch('${id}')">


<div class="match-image">


<img src="${imageUrl}">

<span class="mode">

${(match.type || "SQUAD").toUpperCase()}

</span>



<span class="status">

${timer}

</span>



<div class="overlay">


<h1>

${match.title || "BGMI MATCH"}

</h1>


<p>

${match.map || "Erangel"}

</p>



</div>


</div>





<div class="match-info">


<div class="info-box">


<span>

PRIZE

</span>


<h2>

₹${match.prize || 0}

</h2>


</div>





<div class="info-box">


<span>

ENTRY

</span>


<h2>

₹${match.entry || 0}

</h2>


</div>





<div class="info-box">


<span>

SLOTS

</span>


<h2>

${booked}/${total}

</h2>


</div>



</div>






<div class="progress">


<div class="progress-fill"

style="width:${percent}%">

</div>


</div>



</div>



`;



});



}


);



}







// OPEN MATCH


window.openMatch=function(id){


location.href="match.html?id="+id;


};




</script>
<!-- ==========================
PART 3
MATCH LOAD + FILTER + BOTTOM NAV
========================== -->


<style>

.bottomNav{

position:fixed;

bottom:0;
left:0;
right:0;

height:75px;

max-width:500px;

margin:auto;

background:#111827;

border-top:1px solid #ffffff15;

display:flex;

justify-content:space-around;

align-items:center;

z-index:9999;

}


.navBtn{

background:none;

border:none;

color:#94a3b8;

font-size:12px;

font-weight:700;

height:70px;

}


.navBtn span{

display:block;

font-size:25px;

margin-bottom:3px;

}


.navBtn.active{

color:#22c55e;

}


.empty{

text-align:center;

padding:40px;

color:#94a3b8;

}


</style>



<script type="module">


import {

ref,
onValue

}

from

"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";






// FILTER

window.filterMatches = function(type, btn){

    document.querySelectorAll(".categoryBtn").forEach(b=>{
        b.classList.remove("active");
    });

    btn.classList.add("active");

    document.querySelectorAll(".match-card").forEach(card=>{

        const mode = card.dataset.mode;

        if(type === "all" || mode === type){
            card.style.display = "block";
        }else{
            card.style.display = "none";
        }

    });

};

</script>
<script>
function showWelcome() {

    const user = window.auth?.currentUser;

    if (!user) {
        setTimeout(showWelcome, 500);
        return;
    }

    const key = "welcome_" + user.uid;

    if (!localStorage.getItem(key)) {

        document.getElementById("welcomePopup").style.display = "flex";

        localStorage.setItem(key, "shown");
    }
}

function closeWelcome() {
    document.getElementById("welcomePopup").style.display = "none";
}

window.addEventListener("load", () => {
    setTimeout(showWelcome, 1000);
});

</script>





<!-- BOTTOM NAV -->


<div class="bottomNav">


<button class="navBtn active"

onclick="location.href='dashboard.html'">

<span>🏠</span>

Home

</button>



<button class="navBtn"

onclick="location.href='matches.html'">

<span>🎮</span>

Matches

</button>




<button class="navBtn"

onclick="location.href='wallet.html'">

<span>💰</span>

Wallet

</button>



<button class="navBtn"

onclick="location.href='profile.html'">

<span>👤</span>

Profile

</button>


</div>
<!-- ==========================
LAST PART
USER LIVE UPDATE + CATEGORY FIX
========================== -->


<script type="module">


import {

ref,
onValue

}

from

"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";





// WAIT FOR LOGIN USER


function startUserData(){



const user = window.auth.currentUser;



if(!user){


setTimeout(startUserData,500);

return;


}





const uid=user.uid;




// USER DATA LIVE



onValue(

ref(window.db,"users/"+uid),

(snapshot)=>{


if(!snapshot.exists()){


document.getElementById("playerName").innerHTML="Player";


return;


}



const data=snapshot.val();




// NAME


document.getElementById("playerName").innerHTML =

data.name || "Player";




// PHOTO


if(data.photo){


document.getElementById("profilePhoto").src=data.photo;


}





// WALLET


let wallet=

Number(data.wallet || 0);



document.getElementById("walletAmount").innerHTML=

Math.floor(wallet);



});



}





startUserData();





this.classList.add("active");



let type=this.innerText.toLowerCase();




document.querySelectorAll(".match-card")

.forEach(card=>{


let mode=

card.querySelector(".mode")

.innerText

.toLowerCase();




if(type=="all"){


card.style.display="block";


}

else if(mode==type){


card.style.display="block";


}

else{


card.style.display="none";


}



});







</script>

</body>

</html>
