<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Recharge History</title>

<link rel="manifest"
href="manifest.json">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#020617;
color:#fff;
overflow-x:hidden;
}

body::-webkit-scrollbar{
display:none;
}

.loading{
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
background:#020617;
z-index:9999;
}

.loader{
width:45px;
height:45px;
border-radius:50%;
border:4px solid #334155;
border-top:4px solid #22c55e;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

.header{
height:65px;
background:#111827;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 18px;
border-bottom:1px solid #1f2937;
position:sticky;
top:0;
z-index:100;
}

.logo{
font-size:22px;
font-weight:bold;
color:#22c55e;
}

.backBtn{
padding:10px 18px;
border:none;
border-radius:10px;
background:#2563eb;
color:#fff;
font-weight:bold;
cursor:pointer;
}

.section{
width:95%;
margin:20px auto;
}

.section-title{
font-size:22px;
margin-bottom:15px;
color:#22c55e;
}

.search{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#1e293b;
color:#fff;
margin-bottom:15px;
outline:none;
}

.table{
background:#111827;
border-radius:15px;
overflow:hidden;
}

.table-head{
display:grid;
grid-template-columns:1.5fr 1fr 1fr 1fr 1.5fr;
padding:14px;
background:#1e293b;
font-weight:bold;
color:#22c55e;
}

.table-row{
display:grid;
grid-template-columns:1.5fr 1fr 1fr 1fr 1.5fr;
padding:14px;
border-top:1px solid #1f2937;
align-items:center;
}

.approved{
color:#22c55e;
font-weight:bold;
}

.rejected{
color:#ef4444;
font-weight:bold;
}

@media(max-width:768px){

.table-head{
display:none;
}

.table-row{
display:block;
padding:15px;
}

.table-row div{
margin:8px 0;
}

.logo{
font-size:18px;
}

}

</style>

</head>

<body>

<div class="loading" id="loading">
<div class="loader"></div>
</div>

<div class="header">

<div class="logo">
📜 Recharge History
</div>

</div>

<div class="section">

<h2 class="section-title">
Recharge History
</h2>

<input
type="text"
id="search"
class="search"
placeholder="Search Email">

<div class="table">

<div class="table-head">

<div>Email</div>

<div>Amount</div>

<div>UTR</div>

<div>Status</div>

<div>Date</div>

</div>

<div id="historyTable">

</div>

</div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
getDatabase,
ref,
onValue
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* Firebase Config */

const firebaseConfig = {

apiKey:"AIzaSyDsJUtZdIXcsB0w_2MQhMBXxIgbI3ijOvg",

authDomain:"incoinpaysliveearning.firebaseapp.com",

databaseURL:"https://incoinpaysliveearning-default-rtdb.firebaseio.com",

projectId:"incoinpaysliveearning",

storageBucket:"incoinpaysliveearning.firebasestorage.app",

messagingSenderId:"971873814750",

appId:"1:971873814750:web:7418c7da119e4725ed9a4f"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);

const ADMIN_UID = "VIAP56vYwndWPhJxktn0lRPTWnS2";

let allHistory = [];

/* Admin Check */

onAuthStateChanged(auth,(user)=>{

if(!user){
location.href="admin.html";
return;
}

if(user.uid!==ADMIN_UID){
alert("Access Denied");
location.href="admin.html";
return;
}

document.getElementById("loading").style.display="none";

loadHistory();

});

/* ==========================
   LOAD HISTORY
========================== */

function loadHistory(){

onValue(ref(db,"rechargeRequests"),(snap)=>{

allHistory=[];

if(snap.exists()){

snap.forEach((child)=>{

const data=child.val();

/* Sirf Approved aur Rejected */

if(data.status==="Pending"){
return;
}

allHistory.push(data);

});

}

showHistory(allHistory);

});

}

/* ==========================
   SHOW HISTORY
========================== */

function showHistory(list){

const table=document.getElementById("historyTable");

table.innerHTML="";

if(list.length===0){

table.innerHTML="<center style='padding:20px'>No History Found</center>";

return;

}

/* Latest First */

list.sort((a,b)=>(b.time||0)-(a.time||0));

list.forEach((data)=>{

const date=new Date(data.time||Date.now());

const statusClass=data.status==="Approved"?"approved":"rejected";

table.innerHTML+=`

<div class="table-row">

<div>${data.email||"-"}</div>

<div>₹${data.amount}</div>

<div>${data.utr||"-"}</div>

<div class="${statusClass}">
${data.status}
</div>

<div>

${date.toLocaleDateString()}<br>

${date.toLocaleTimeString()}

</div>

</div>

`;

});

}

/* ==========================
   SEARCH
========================== */

document.getElementById("search").addEventListener("input",function(){

const value=this.value.toLowerCase();

const result=allHistory.filter(item=>

(item.email||"").toLowerCase().includes(value)

);

showHistory(result);

});

</script>

</body>

</html>
