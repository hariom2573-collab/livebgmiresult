<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<meta name="theme-color" content="#050B18">

<title>Admin Wallet Requests</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#050B18;
    color:#fff;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
    radial-gradient(
        circle at 10% 0%,
        rgba(34,197,94,.20),
        transparent 35%
    ),

    radial-gradient(
        circle at 90% 10%,
        rgba(37,99,235,.18),
        transparent 35%
    ),

    radial-gradient(
        circle at 50% 100%,
        rgba(168,85,247,.10),
        transparent 40%
    ),

    #050B18;

    z-index:-2;
}

.app{
    width:100%;
    max-width:520px;
    min-height:100vh;
    margin:auto;
    padding:18px;
    padding-bottom:100px;
}

/* HEADER */

.header{
    text-align:center;
    padding:8px 0 22px;
}

.header h1{
    font-size:27px;
    font-weight:800;
}

.header p{
    margin-top:6px;
    color:#94a3b8;
    font-size:12px;
    font-weight:500;
}

.adminBadge{
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin-top:10px;
    padding:6px 12px;
    border-radius:30px;
    background:rgba(34,197,94,.10);
    border:1px solid rgba(34,197,94,.25);
    color:#22c55e;
    font-size:11px;
    font-weight:700;
}

.adminDot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 10px #22c55e;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:20px;
}

.statCard{
    background:
    linear-gradient(
        145deg,
        rgba(17,24,39,.98),
        rgba(15,23,42,.96)
    );

    border:1px solid rgba(255,255,255,.07);
    border-radius:18px;
    padding:15px 7px;
    text-align:center;

    box-shadow:
    0 10px 25px rgba(0,0,0,.20);
}

.statNumber{
    display:block;
    color:#22c55e;
    font-size:23px;
    line-height:1.1;
    font-weight:800;
}

.statLabel{
    display:block;
    margin-top:5px;
    color:#94a3b8;
    font-size:10px;
    font-weight:600;
}

/* TABS */

.tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:18px;
}

.tab{
    height:52px;
    border:none;
    border-radius:15px;
    background:#111827;
    color:#fff;

    border:1px solid rgba(255,255,255,.07);

    font-size:14px;
    font-weight:800;
    cursor:pointer;

    transition:.2s;
}

.tab:active{
    transform:scale(.97);
}

.tab.active{
    background:#22c55e;
    color:#000;
    border-color:#22c55e;

    box-shadow:
    0 8px 22px rgba(34,197,94,.20);
}

/* LIST */

.requestList{
    width:100%;
}

/* CARD */

.requestCard{
    background:
    linear-gradient(
        145deg,
        #111827,
        #0f172a
    );

    border:1px solid rgba(255,255,255,.08);
    border-radius:21px;

    padding:17px;
    margin-bottom:15px;

    box-shadow:
    0 12px 30px rgba(0,0,0,.25);
}

.cardHeader{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    gap:10px;
    margin-bottom:14px;
}

.cardTitle{
    font-size:16px;
    font-weight:800;
}

.cardId{
    margin-top:3px;
    color:#64748b;
    font-size:9px;
    word-break:break-all;
}

/* STATUS */

.status{
    flex-shrink:0;

    padding:6px 11px;
    border-radius:30px;

    font-size:10px;
    font-weight:800;
    text-transform:capitalize;
}

.status.pending{
    background:#facc15;
    color:#000;
}

/* INFO */

.infoRow{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    gap:12px;
    padding:10px 0;

    border-bottom:
    1px solid rgba(255,255,255,.06);
}

.infoRow:last-child{
    border-bottom:none;
}

.infoLabel{
    color:#94a3b8;
    font-size:11px;
    font-weight:500;
}

.infoValue{
    max-width:68%;
    color:#fff;
    text-align:right;
    word-break:break-word;

    font-size:12px;
    font-weight:700;
}

.amount{
    color:#22c55e;
    font-size:18px;
    font-weight:800;
}

/* ACTION BUTTONS */

.actionButtons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;

    margin-top:16px;
}

.actionBtn{
    height:46px;
    border:none;
    border-radius:13px;

    font-size:13px;
    font-weight:800;
    cursor:pointer;

    transition:.15s;
}

.actionBtn:active{
    transform:scale(.96);
}

.actionBtn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.approveBtn{
    background:#22c55e;
    color:#000;
}

.rejectBtn{
    background:#ef4444;
    color:#fff;
}

/* EMPTY */

.empty{
    padding:55px 20px;
    text-align:center;

    background:#111827;

    border:1px solid rgba(255,255,255,.07);
    border-radius:20px;
}

.emptyIcon{
    font-size:38px;
    margin-bottom:8px;
}

.emptyTitle{
    font-size:16px;
    font-weight:700;
}

.emptyText{
    margin-top:5px;
    color:#64748b;
    font-size:11px;
}

/* LOADER */

.loader{
    display:flex;
    justify-content:center;
    align-items:center;

    padding:50px 20px;
}

.spinner{
    width:42px;
    height:42px;

    border-radius:50%;

    border:4px solid rgba(255,255,255,.10);
    border-top-color:#22c55e;

    animation:spin .8s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}

/* TOAST */

.toast{
    position:fixed;

    left:50%;
    bottom:25px;

    width:calc(100% - 36px);
    max-width:470px;

    padding:14px 16px;

    background:#111827;

    border:1px solid rgba(255,255,255,.10);
    border-radius:14px;

    color:#fff;
    text-align:center;

    font-size:12px;
    font-weight:600;

    opacity:0;
    visibility:hidden;

    transform:translate(-50%,20px);

    transition:.25s;

    z-index:99999;

    box-shadow:
    0 15px 35px rgba(0,0,0,.40);
}

.toast.show{
    opacity:1;
    visibility:visible;

    transform:translate(-50%,0);
}

/* MOBILE */

@media(max-width:360px){

    .app{
        padding:14px;
    }

    .header h1{
        font-size:23px;
    }

    .statCard{
        padding:13px 4px;
    }

    .statNumber{
        font-size:20px;
    }

    .requestCard{
        padding:14px;
    }

}

button{
    user-select:none;
    -webkit-user-select:none;
}

</style>

</head>

<body>

<div class="app">

<!-- HEADER -->

<div class="header">

    <h1>
        💳 Wallet Requests
    </h1>

    <p>
        Manage deposits & withdrawals
    </p>

    <div class="adminBadge">

        <span class="adminDot"></span>

        ADMIN PANEL

    </div>

</div>


<!-- STATS -->

<div class="stats">

    <div class="statCard">

        <span
        class="statNumber"
        id="depositCount">
            0
        </span>

        <span class="statLabel">
            DEPOSITS
        </span>

    </div>


    <div class="statCard">

        <span
        class="statNumber"
        id="withdrawCount">
            0
        </span>

        <span class="statLabel">

        </span>

    </div>


    <div class="statCard">

        <span
        class="statNumber"
        id="pendingCount">
            0
        </span>

        <span class="statLabel">

        </span>

<!-- TABS -->

<div class="tabs">

    </button>

</div>


<!-- DEPOSITS -->

<div
id="depositList"
class="requestList">

    <div class="loader">

        <div class="spinner"></div>

    </div>

</div>

<div
id="withdrawList"
class="requestList"
style="display:none;">

    <div class="loader">

        <div class="spinner"></div>

    </div>

</div>

</div>

<!-- TOAST -->

<div
id="toast"
class="toast">
    Message
</div>

<script type="module">

/* =================================
   FIREBASE IMPORTS
================================= */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";


import {
    getDatabase,
    ref,
    onValue,
    get,
    update,
    push,
    set
}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";


/* =================================
   FIREBASE CONFIG
================================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyDsJUtZdIXcsB0w_2MQhMBXxIgbI3ijOvg",

    authDomain:
    "incoinpaysliveearning.firebaseapp.com",

    databaseURL:
    "https://incoinpaysliveearning-default-rtdb.firebaseio.com",

    projectId:
    "incoinpaysliveearning",

    storageBucket:
    "incoinpaysliveearning.firebasestorage.app",

    messagingSenderId:
    "971873814750",

    appId:
    "1:971873814750:web:7418c7da119e4725ed9a4f"

};


/* =================================
   INITIALIZE FIREBASE
================================= */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getDatabase(app);


/* =================================
   ADMIN UID
================================= */

const ADMIN_UID =
"VIAP56vYwndWPhJxktn0lRPTWnS2";


/* =================================
   DATA
================================= */

let depositData = [];

let withdrawData = [];

const processing =
new Set();


/* =================================
   AUTH CHECK
================================= */

onAuthStateChanged(
    auth,
    (user) => {

        if(!user){

            location.replace("index.html");

            return;
        }


        if(user.uid !== ADMIN_UID){

            alert("Access Denied");

            location.replace("dashboard.html");

            return;
        }


        loadDeposits();

        loadWithdraws();

    }
);


/* =================================
   TOAST
================================= */

function showToast(message){

    const toast =
    document.getElementById("toast");

    toast.innerText =
    message;

    toast.classList.add("show");

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
    setTimeout(
        () => {

            toast.classList.remove("show");

        },
        2500
    );

}


/* =================================
   HTML ESCAPE
================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =================================
   LOAD DEPOSITS
================================= */

function loadDeposits(){

    onValue(
        ref(db,"depositRequests"),

        (snapshot) => {

            depositData = [];

            if(snapshot.exists()){

                snapshot.forEach(
                    (item) => {

                        depositData.push({

                            id:item.key,

                            ...item.val()

                        });

                    }
                );

            }


            depositData.sort(
                (a,b) =>
                Number(b.time || 0) -
                Number(a.time || 0)
            );


            renderDeposits();

            updateStats();

        },

        (error) => {

            console.error(
                "Deposit load error:",
                error
            );

            showToast(
                "Deposit load error: " +
                error.message
            );

        }
    );

}


/* =================================
   LOAD WITHDRAWS
================================= */

function loadWithdraws(){

    onValue(
        ref(db,"withdrawRequests"),

        (snapshot) => {

            withdrawData = [];

            if(snapshot.exists()){

                snapshot.forEach(
                    (item) => {

                        withdrawData.push({

                            id:item.key,

                            ...item.val()

                        });

                    }
                );

            }


            withdrawData.sort(
                (a,b) =>
                Number(b.time || 0) -
                Number(a.time || 0)
            );


            renderWithdraws();

            updateStats();

        },

        (error) => {

            console.error(
                "Withdraw load error:",
                error
            );

            showToast(
                "Withdraw load error: " +
                error.message
            );

        }
    );

}


/* =================================
   RENDER DEPOSITS
================================= */

function renderDeposits(){

    const box =
    document.getElementById(
        "depositList"
    );

    box.innerHTML = "";


    const pending =
    depositData.filter(
        item =>
        String(
            item.status || ""
        ).toLowerCase() === "pending"
    );


    if(pending.length === 0){

        box.innerHTML = `

            <div class="empty">

                <div class="emptyIcon">
                    💰
                </div>

                <div class="emptyTitle">
                    No Pending Deposits
                </div>

                <div class="emptyText">
                    New deposit requests will appear here.
                </div>

            </div>

        `;

        return;
    }


    pending.forEach(
        (item) => {

            const amount =
            Number(item.amount || 0);


            const time =
            item.time
            ? new Date(item.time).toLocaleString()
            : "Unknown";


            box.innerHTML += `

                <div class="requestCard">

                    <div class="cardHeader">

                        <div>

                            <div class="cardTitle">
                                💰 Deposit Request
                            </div>

                            <div class="cardId">
                                ID:
                                ${escapeHTML(item.id)}
                            </div>

                        </div>

                        <div class="status pending">
                            Pending
                        </div>

                    </div>


                    <div class="infoRow">

                        <span class="infoLabel">
                            User UID
                        </span>

                        <span class="infoValue">
                            ${escapeHTML(item.uid)}
                        </span>

                    </div>


                    <div class="infoRow">

                        <span class="infoLabel">
                            Amount
                        </span>

                        <span class="infoValue amount">
                            ₹${amount}
                        </span>

                    </div>


                    <div class="infoRow">

                        <span class="infoLabel">
                            UTR
                        </span>

                        <span class="infoValue">
                            ${escapeHTML(item.utr)}
                        </span>

                    </div>


                    <div class="infoRow">

                        <span class="infoLabel">
                            Time
                        </span>

                        <span class="infoValue">
                            ${escapeHTML(time)}
                        </span>

                    </div>


                    <div class="actionButtons">

                        <button
                        class="actionBtn approveBtn"
                        onclick="approveDeposit('${escapeHTML(item.id)}')">

                            ✓ Approve

                        </button>


                        <button
                        class="actionBtn rejectBtn"
                        onclick="rejectDeposit('${escapeHTML(item.id)}')">

                            ✕ Reject

                        </button>

                    </div>

                </div>

            `;

        }
    );

}


/* =================================
   RENDER WITHDRAWS
================================= */

function renderWithdraws(){

    const box =
    document.getElementById(
        "withdrawList"
    );

    box.innerHTML = "";


    const pending =
    withdrawData.filter(
        item =>
        String(
            item.status || ""
        ).toLowerCase() === "pending"
    );


    if(pending.length === 0){

        box.innerHTML = `

            <div class="empty">

                <div class="emptyIcon">
                    💸
                </div>

                <div class="emptyTitle">
                    No Pending Withdrawals
                </div>

                <div class="emptyText">
                    New withdrawal requests will appear here.
                </div>

            </div>

        `;

        return;
    }


    pending.forEach(
        (item) => {

            const amount =
            Number(item.amount || 0);


            const time =
            item.time
            ? new Date(item.time).toLocaleString()
            : "Unknown";


            box.innerHTML += `

                <div class="requestCard">

                    <div class="cardHeader">

                        <div>

                            <div class="cardTitle">
                                💸 Withdraw Request
                            </div>

                            <div class="cardId">
                                ID:
                                ${escapeHTML(item.id)}
                            </div>

                        </div>

                        <div class="status pending">
                            Pending
                        </div>

                    </div>


                    <div class="infoRow">

                        <span class="infoLabel">
                            User UID
                        </span>

                        <span class="infoValue">
                            ${escapeHTML(item.uid)}
                        </span>

                    </div>


                    <div class="infoRow">

                        <span class="infoLabel">
                            Amount
                        </span>

                        <span class="infoValue amount">
                            ₹${amount}
                        </span>

                    </div>


                    <div class="infoRow">

                        <span class="infoLabel">
                            UPI ID
                        </span>

                        <span class="infoValue">
                            ${escapeHTML(item.upi)}
                        </span>

                    </div>


                    <div class="infoRow">

                        <span class="infoLabel">
                            Time
                        </span>

                        <span class="infoValue">
                            ${escapeHTML(time)}
                        </span>

                    </div>


                    <div class="actionButtons">

                        <button
                        class="actionBtn approveBtn"
                        onclick="approveWithdraw('${escapeHTML(item.id)}')">

                            ✓ Approve

                        </button>


                        <button
                        class="actionBtn rejectBtn"
                        onclick="rejectWithdraw('${escapeHTML(item.id)}')">

                            ✕ Reject

                        </button>

                    </div>

                </div>

            `;

        }
    );

}


/* =================================
   STATS
================================= */

function updateStats(){

    const pendingDeposits =
    depositData.filter(
        item =>
        String(
            item.status || ""
        ).toLowerCase() === "pending"
    ).length;


    const pendingWithdraws =
    withdrawData.filter(
        item =>
        String(
            item.status || ""
        ).toLowerCase() === "pending"
    ).length;


    document.getElementById(
        "depositCount"
    ).innerText =
    depositData.length;


    document.getElementById(
        "withdrawCount"
    ).innerText =
    withdrawData.length;


    document.getElementById(
        "pendingCount"
    ).innerText =
    pendingDeposits +
    pendingWithdraws;

}


/* =================================
   APPROVE DEPOSIT
================================= */

window.approveDeposit =
async function(requestId){

    if(processing.has(requestId)){
        return;
    }

    processing.add(requestId);


    try{

        const requestRef =
        ref(
            db,
            "depositRequests/" +
            requestId
        );


        const requestSnap =
        await get(requestRef);


        if(!requestSnap.exists()){

            throw new Error(
                "Deposit request not found"
            );

        }


        const request =
        requestSnap.val();


        const status =
        String(
            request.status || ""
        ).toLowerCase();


        if(status !== "pending"){

            showToast(
                "Request already processed"
            );

            return;
        }


        const uid =
        String(
            request.uid || ""
        );


        const amount =
        Number(
            request.amount || 0
        );


        if(!uid){

            throw new Error(
                "User UID missing"
            );

        }


        if(
            !Number.isFinite(amount) ||
            amount <= 0
        ){

            throw new Error(
                "Invalid deposit amount"
            );

        }


        const userRef =
        ref(
            db,
            "users/" + uid
        );


        const userSnap =
        await get(userRef);


        if(!userSnap.exists()){

            throw new Error(
                "User not found"
            );

        }


        const user =
        userSnap.val();


        const oldWallet =
        Number(
            user.wallet || 0
        );


        const newWallet =
        oldWallet + amount;


        /* UPDATE WALLET */

        await update(
            userRef,
            {
                wallet:newWallet
            }
        );


        /* UPDATE REQUEST */

        await update(
            requestRef,
            {
                status:"approved",
                processedAt:Date.now(),
                processedBy:ADMIN_UID
            }
        );


        /* TRANSACTION */

        const transactionRef =
        push(
            ref(
                db,
                "users/" +
                uid +
                "/transactions"
            )
        );


        await set(
            transactionRef,
            {
                title:"Wallet Deposit",
                amount:amount,
                type:"credit",
                time:Date.now()
            }
        );


        /* NOTIFICATION */

        const notificationRef =
        push(
            ref(
                db,
                "users/" +
                uid +
                "/notifications"
            )
        );


        await set(
            notificationRef,
            {
                message:
                "✅ ₹" +
                amount +
                " deposit approved.",

                time:Date.now(),

                read:false
            }
        );


        showToast(
            "Deposit Approved Successfully"
        );

    }
    catch(error){

        console.error(
            "Approve Deposit Error:",
            error
        );

        showToast(
            "Error: " +
            error.message
        );

    }
    finally{

        processing.delete(requestId);

    }

};


/* =================================
   REJECT DEPOSIT
================================= */

window.rejectDeposit =
async function(requestId){

    if(processing.has(requestId)){
        return;
    }

    processing.add(requestId);


    try{

        const requestRef =
        ref(
            db,
            "depositRequests/" +
            requestId
        );


        const requestSnap =
        await get(requestRef);


        if(!requestSnap.exists()){

            throw new Error(
                "Deposit request not found"
            );

        }


        const request =
        requestSnap.val();


        const status =
        String(
            request.status || ""
        ).toLowerCase();


        if(status !== "pending"){

            showToast(
                "Request already processed"
            );

            return;

        }


        await update(
            requestRef,
            {
                status:"rejected",
                processedAt:Date.now(),
                processedBy:ADMIN_UID
            }
        );


        if(request.uid){

            const notificationRef =
            push(
                ref(
                    db,
                    "users/" +
                    request.uid +
                    "/notifications"
                )
            );


            await set(
                notificationRef,
                {
                    message:
                    "❌ Your deposit request was rejected.",

                    time:Date.now(),

                    read:false
                }
            );

        }


        showToast(
            "Deposit Rejected"
        );

    }
    catch(error){

        console.error(
            "Reject Deposit Error:",
            error
        );

        showToast(
            "Error: " +
            error.message
        );

    }
    finally{

        processing.delete(requestId);

    }

};


/* =================================
   APPROVE WITHDRAW
================================= */

window.approveWithdraw =
async function(requestId){

    if(processing.has(requestId)){
        return;
    }

    processing.add(requestId);


    try{

        const requestRef =
        ref(
            db,
            "withdrawRequests/" +
            requestId
        );


        const requestSnap =
        await get(requestRef);


        if(!requestSnap.exists()){

            throw new Error(
                "Withdraw request not found"
            );

        }


        const request =
        requestSnap.val();


        const status =
        String(
            request.status || ""
        ).toLowerCase();


        if(status !== "pending"){

            showToast(
                "Withdraw already processed"
            );

            return;

        }


        const uid =
        String(
            request.uid || ""
        );


        const amount =
        Number(
            request.amount || 0
        );


        if(!uid){

            throw new Error(
                "User UID missing"
            );

        }


        if(
            !Number.isFinite(amount) ||
            amount <= 0
        ){

            throw new Error(
                "Invalid withdrawal amount"
            );

        }


        const userRef =
        ref(
            db,
            "users/" + uid
        );


        const userSnap =
        await get(userRef);


        if(!userSnap.exists()){

            throw new Error(
                "User not found"
            );

        }


        const user =
        userSnap.val();


        const oldWallet =
        Number(
            user.wallet || 0
        );


        if(oldWallet < amount){

            throw new Error(
                "Insufficient wallet balance"
            );

        }


        const newWallet =
        oldWallet - amount;


        /* DEDUCT WALLET */

        await update(
            userRef,
            {
                wallet:newWallet
            }
        );


        /* APPROVE REQUEST */

        await update(
            requestRef,
            {
                status:"approved",
                processedAt:Date.now(),
                processedBy:ADMIN_UID
            }
        );


        /* TRANSACTION */

        const transactionRef =
        push(
            ref(
                db,
                "users/" +
                uid +
                "/transactions"
            )
        );


        await set(
            transactionRef,
            {
                title:"Wallet Withdraw",
                amount:amount,
                type:"debit",
                time:Date.now()
            }
        );


        /* NOTIFICATION */

        const notificationRef =
        push(
            ref(
                db,
                "users/" +
                uid +
                "/notifications"
            )
        );


        await set(
            notificationRef,
            {
                message:
                "✅ ₹" +
                amount +
                " withdrawal approved.",

                time:Date.now(),

                read:false
            }
        );


        showToast(
            "Withdraw Approved Successfully"
        );

    }
    catch(error){

        console.error(
            "Approve Withdraw Error:",
            error
        );

        showToast(
            "Withdraw Error: " +
            error.message
        );

    }
    finally{

        processing.delete(requestId);

    }

};
