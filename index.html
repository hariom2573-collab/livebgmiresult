<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#050B18">

<title>BGMI ESPORTS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
-webkit-tap-highlight-color:transparent;
}

html{
scroll-behavior:smooth;
}

body{

background:#050B18;
color:#fff;
overflow:hidden;

}

/* Background */

body::before{

content:"";

position:fixed;

inset:0;

background:

radial-gradient(circle at top left,
rgba(34,197,94,.20),
transparent 35%),

radial-gradient(circle at top right,
rgba(37,99,235,.20),
transparent 35%),

radial-gradient(circle at bottom,
rgba(168,85,247,.18),
transparent 40%),

#050B18;

z-index:-5;

}

/* Glow */

.glow{

position:fixed;

border-radius:50%;

filter:blur(90px);

opacity:.45;

animation:floatGlow 12s linear infinite alternate;

z-index:-4;

}

.glow1{

width:240px;
height:240px;

background:#22c55e;

top:-80px;
left:-80px;

}

.glow2{

width:240px;
height:240px;

background:#2563eb;

top:150px;
right:-90px;

animation-delay:2s;

}

.glow3{

width:220px;
height:220px;

background:#9333ea;

bottom:-70px;
left:35%;

animation-delay:4s;

}

@keyframes floatGlow{

100%{

transform:translate(40px,40px);

}

}

/* Splash */

#splash{

position:fixed;

inset:0;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

background:#050B18;

z-index:999999;

}

.logo{

width:120px;

height:120px;

border-radius:50%;

display:flex;

justify-content:center;

align-items:center;

font-size:55px;

background:linear-gradient(135deg,#16a34a,#22c55e);

box-shadow:

0 0 40px rgba(34,197,94,.55),

0 0 80px rgba(34,197,94,.20);

animation:pulse 1.5s infinite;

}

@keyframes pulse{

50%{

transform:scale(1.08);

}

}

.logoTitle{

margin-top:25px;

font-size:28px;

font-weight:800;

letter-spacing:1px;

}

.logoSub{

margin-top:8px;

font-size:13px;

color:#94a3b8;

}

/* Main */

.container{

display:none;

width:100%;

max-width:450px;

margin:auto;

padding:25px;

min-height:100vh;

justify-content:center;

align-items:center;

flex-direction:column;

}

.card{

width:100%;

background:rgba(17,24,39,.92);

border:1px solid rgba(255,255,255,.08);

border-radius:28px;

padding:28px;

backdrop-filter:blur(20px);

box-shadow:

0 20px 50px rgba(0,0,0,.35);

}

.title{

font-size:28px;

font-weight:800;

text-align:center;

margin-bottom:8px;

}

.subtitle{

text-align:center;

font-size:13px;

color:#94a3b8;

margin-bottom:25px;

}

input{

width:100%;

height:55px;

margin-bottom:15px;

padding:0 16px;

border:none;

outline:none;

border-radius:14px;

background:#1f2937;

color:#fff;

font-size:15px;

}

input::placeholder{

color:#94a3b8;

}

button{

width:100%;

height:55px;

border:none;

border-radius:14px;

background:#22c55e;

color:#000;

font-size:16px;

font-weight:700;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:scale(1.02);

}

.link{

margin-top:18px;

text-align:center;

font-size:14px;

color:#94a3b8;

cursor:pointer;

}

.link span{

color:#22c55e;

font-weight:700;

}

.error{

margin-top:10px;

text-align:center;

color:#ef4444;

font-size:13px;

}

.success{

margin-top:10px;

text-align:center;

color:#22c55e;

font-size:13px;

}

</style>

</head>

<body>

<div class="glow glow1"></div>
<div class="glow glow2"></div>
<div class="glow glow3"></div>

<div id="splash">

<div class="logo">
🎮
</div>

<div class="logoTitle">
BGMI ESPORTS
</div>

<div class="logoSub">
Loading...
</div>

</div>
<div class="container" id="mainContainer">

    <div class="card">

        <div class="title" id="formTitle">
            Welcome Back
        </div>

        <div class="subtitle" id="formSubTitle">
            Login to continue
        </div>

        <!-- Name (Register Only) -->
        <input
        type="text"
        id="name"
        placeholder="Full Name"
        style="display:none;">

        <!-- Email -->
        <input
        type="email"
        id="email"
        placeholder="Email Address">

        <!-- Password -->
        <input
        type="password"
        id="password"
        placeholder="Password">

        <!-- Confirm Password -->
        <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm Password"
        style="display:none;">

        <!-- Login Button -->
        <button id="loginBtn" onclick="loginUser()">
            LOGIN
        </button>

        <!-- Register Button -->
        <button
        id="registerBtn"
        onclick="registerUser()"
        style="display:none;margin-top:12px;">
            CREATE ACCOUNT
        </button>

        <!-- Forgot Password -->
        <div
        id="forgotBox"
        class="link"
        onclick="forgotPassword()">
            Forgot Password?
        </div>

        <!-- Switch -->
        <div
        id="switchBox"
        class="link">

            Don't have an account?

            <span onclick="showRegister()">
                Register
            </span>

        </div>

        <!-- Message -->
        <div id="message" class="error"></div>

    </div>

</div>

<script>

/* Splash */

setTimeout(()=>{

document.getElementById("splash").style.display="none";

document.getElementById("mainContainer").style.display="flex";

},2000);

/* Register Screen */

function showRegister(){

document.getElementById("formTitle").innerHTML="Create Account";

document.getElementById("formSubTitle").innerHTML="Register your account";

document.getElementById("name").style.display="block";

document.getElementById("confirmPassword").style.display="block";

document.getElementById("loginBtn").style.display="none";

document.getElementById("registerBtn").style.display="block";

document.getElementById("forgotBox").style.display="none";

document.getElementById("switchBox").innerHTML=

'Already have an account? <span onclick="showLogin()">Login</span>';

}

/* Login Screen */

function showLogin(){

document.getElementById("formTitle").innerHTML="Welcome Back";

document.getElementById("formSubTitle").innerHTML="Login to continue";

document.getElementById("name").style.display="none";

document.getElementById("confirmPassword").style.display="none";

document.getElementById("loginBtn").style.display="block";

document.getElementById("registerBtn").style.display="none";

document.getElementById("forgotBox").style.display="block";

document.getElementById("switchBox").innerHTML=

'Don\'t have an account? <span onclick="showRegister()">Register</span>';

}

</script>
<!-- ==========================
PART 2A
FIREBASE IMPORT + CONFIG + AUTH
========================== -->

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signInWithEmailAndPassword,
createUserWithEmailAndPassword,
sendPasswordResetEmail,
updateProfile
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
getDatabase,
ref,
set,
get
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* Firebase Config */

const firebaseConfig = {

apiKey:"AIzaSyDsJUtZdIXcsB0w_2MQhMBXxIgbI3ijOvg",

authDomain:"incoinpaysliveearning.firebaseapp.com",

databaseURL:"https://incoinpaysliveearning-default-rtdb.firebaseio.com",

projectId:"incoinpaysliveearning",

storageBucket:"incoinpaysliveearning.firebasestorage.app",

messagingSenderId:"971873814750",

appId:"1:971873814750:web:7418c7da119e4725ed9a4f"

};

/* Initialize */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);

/* Auto Login */

onAuthStateChanged(auth,(user)=>{

if(user){

location.href="dashboard.html";

}

});

window.auth=auth;
window.db=db;
window.ref=ref;
window.set=set;
window.get=get;
window.createUserWithEmailAndPassword=createUserWithEmailAndPassword;
window.signInWithEmailAndPassword=signInWithEmailAndPassword;
window.sendPasswordResetEmail=sendPasswordResetEmail;
window.updateProfile=updateProfile;
/* ==========================
PART 2B
LOGIN + REGISTER + RESET PASSWORD
========================== */

window.loginUser = async function(){

const email = document.getElementById("email").value.trim();

const password = document.getElementById("password").value.trim();

const msg = document.getElementById("message");

msg.className="error";
msg.innerHTML="";

if(email=="" || password==""){

msg.innerHTML="Please fill all fields.";

return;

}

try{

await signInWithEmailAndPassword(auth,email,password);

msg.className="success";
msg.innerHTML="Login Successful...";

setTimeout(()=>{

location.href="dashboard.html";

},800);

}catch(e){

msg.className="error";
msg.innerHTML=e.message;

}

};



window.registerUser = async function(){

const name=document.getElementById("name").value.trim();

const email=document.getElementById("email").value.trim();

const password=document.getElementById("password").value.trim();

const confirm=document.getElementById("confirmPassword").value.trim();

const msg=document.getElementById("message");

msg.className="error";
msg.innerHTML="";

if(name=="" || email=="" || password=="" || confirm==""){

msg.innerHTML="Please fill all fields.";

return;

}

if(password!==confirm){

msg.innerHTML="Passwords do not match.";

return;

}

try{

const userCredential=

await createUserWithEmailAndPassword(auth,email,password);

const user=userCredential.user;

await updateProfile(user,{

displayName:name

});

await set(ref(db,"users/"+user.uid),{

uid:user.uid,

name:name,

email:email,

wallet:0,

winning:0,

deposit:0,

photo:"https://i.imgur.com/6VBx3io.png",

createdAt:Date.now()

});

msg.className="success";
msg.innerHTML="Account Created Successfully.";

setTimeout(()=>{

location.href="dashboard.html";

},1000);

}catch(e){

msg.className="error";
msg.innerHTML=e.message;

}

};



window.forgotPassword = async function(){

const email=document.getElementById("email").value.trim();

const msg=document.getElementById("message");

msg.className="error";
msg.innerHTML="";

if(email==""){

msg.innerHTML="Enter your email first.";

return;

}

try{

await sendPasswordResetEmail(auth,email);

msg.className="success";

msg.innerHTML="Password reset email sent.";

}catch(e){

msg.className="error";

msg.innerHTML=e.message;

}

};
/* ==========================
PART 2C
AUTO LOGIN + CLOSE MODULE
========================== */

onAuthStateChanged(auth,(user)=>{

if(user){

location.replace("dashboard.html");

}

});

/* End Firebase Module */

</script>

</body>
</html>
