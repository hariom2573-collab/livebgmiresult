<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JACKWAR ESPORTS</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

background:linear-gradient(135deg,#020617,#0f172a,#111827);

height:100vh;

display:flex;

justify-content:center;

align-items:center;

color:#fff;

}

.login-box{

width:92%;

max-width:380px;

background:#0f172a;

padding:25px;

border-radius:22px;

box-shadow:0 15px 40px rgba(0,0,0,.45);

border:1px solid rgba(255,215,0,.25);

}

.logo{

text-align:center;

font-size:28px;

font-weight:800;

color:#FFD700;

margin-bottom:8px;

}

.sub{

text-align:center;

font-size:13px;

color:#94a3b8;

margin-bottom:25px;

}

.input{

width:100%;

padding:13px;

margin-bottom:15px;

border:none;

border-radius:12px;

background:#1e293b;

color:#fff;

outline:none;

font-size:15px;

}

.input::placeholder{

color:#94a3b8;

}

.login-btn{

width:100%;

padding:14px;

border:none;

border-radius:14px;

background:linear-gradient(90deg,#FFD700,#ffb300);

font-weight:700;

font-size:16px;

cursor:pointer;

color:#000;

}

.login-btn:hover{

opacity:.95;

}

.register{

margin-top:18px;

text-align:center;

font-size:14px;

}

.register a{

color:#22c55e;

text-decoration:none;

font-weight:bold;

}

#error{

margin-top:15px;

text-align:center;

color:#ff6b6b;

font-size:14px;

}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">
🎮 BGMI TOURNAMENT
</div>

<div class="sub">
Login to Continue
</div>

<input
type="email"
id="email"
class="input"
placeholder="Enter Email">

<input
type="password"
id="password"
class="input"
placeholder="Enter Password">

<button
class="login-btn"
onclick="loginUser()">

LOGIN

</button>

<div id="error"></div>

<div class="register">

Don't have an account?

<a href="register.html">

Register

</a>

</div>

</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig={
apiKey:"AIzaSyDsJUtZdIXcsB0w_2MQhMBXxIgbI3ijOvg",
authDomain:"incoinpaysliveearning.firebaseapp.com",
databaseURL:"https://incoinpaysliveearning-default-rtdb.firebaseio.com",
projectId:"incoinpaysliveearning",
storageBucket:"incoinpaysliveearning.firebasestorage.app",
messagingSenderId:"971873814750",
appId:"1:971873814750:web:7418c7da119e4725ed9a4f"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);

/* Auto Login */

onAuthStateChanged(auth,(user)=>{

if(user){

window.location.href="dashboard.html";

}

});

/* Login */

window.loginUser=function(){

const email=document.getElementById("email").value.trim();

const password=document.getElementById("password").value.trim();

const error=document.getElementById("error");

error.innerHTML="";

if(email===""||password===""){

error.innerHTML="Please enter Email & Password";

return;

}

signInWithEmailAndPassword(auth,email,password)

.then(()=>{

window.location.href="dashboard.html";

})

.catch((err)=>{

error.innerHTML=err.message;

});

};

</script>

</body>
</html>
