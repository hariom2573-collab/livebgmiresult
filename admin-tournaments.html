<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">


<title>Manage Tournament</title>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
-webkit-tap-highlight-color:transparent;
}


body{

background:#050B18;
color:white;
min-height:100vh;

}



.app{

width:100%;
max-width:500px;
margin:auto;
padding:18px;

}



/* HEADER */

.header{

background:#111827;
padding:20px;
border-radius:22px;
margin-bottom:20px;
border:1px solid rgba(255,255,255,.08);

}



.header h1{

font-size:22px;
color:#22c55e;

}





.createBtn{

width:100%;
height:50px;

margin-top:18px;

border:none;
border-radius:14px;

background:#22c55e;

color:#000;

font-size:15px;
font-weight:800;

}





/* CARD */


.tournament{

background:#111827;

padding:18px;

border-radius:20px;

margin-bottom:15px;

border:1px solid rgba(255,255,255,.08);

}





.title{

font-size:20px;

font-weight:800;

color:white;

}




.row{

display:flex;

justify-content:space-between;

margin-top:12px;

font-size:14px;

color:#94a3b8;

}



.row b{

color:white;

}





/* STATUS */


.statusSelect{

width:100%;

height:45px;

margin-top:15px;

border:none;

border-radius:12px;

background:#1f2937;

color:white;

padding:0 12px;

font-size:15px;

font-weight:700;

}






/* ROOM */


.roomBox{

display:none;

margin-top:15px;

}



.roomInput{

width:100%;

height:45px;

margin-top:10px;

border:none;

outline:none;

border-radius:12px;

background:#0f172a;

color:white;

padding:0 12px;

font-size:14px;

}




/* BUTTONS */


.actionBtn{

width:100%;

height:45px;

margin-top:12px;

border:none;

border-radius:12px;

font-weight:800;

cursor:pointer;

}



.saveBtn{

background:#22c55e;

color:#000;

}



.deleteBtn{

background:#ef4444;

color:white;

}




.empty{

text-align:center;

padding:40px;

color:#94a3b8;

}




.loader{

text-align:center;

padding:30px;

color:#22c55e;

}



</style>


</head>


<body>



<div class="app">



<div class="header">


<h1>
🏆 Manage Tournament
</h1>



<button class="createBtn"
onclick="location.href='admin-create-tournament.html'">

➕ Create Tournament

</button>



</div>





<div id="tournamentList">


<div class="loader">

Loading Tournament...

</div>


</div>





</div>





<script type="module">


import {

initializeApp

}

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";



import {

getDatabase,
ref,
onValue,
update,
remove

}

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";



import {

getAuth,
onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";






const firebaseConfig = {


apiKey:"AIzaSyDsJUtZdIXcsB0w_2MQhMBXxIgbI3ijOvg",

authDomain:"incoinpaysliveearning.firebaseapp.com",

databaseURL:"https://incoinpaysliveearning-default-rtdb.firebaseio.com",

projectId:"incoinpaysliveearning",

storageBucket:"incoinpaysliveearning.firebasestorage.app",

messagingSenderId:"971873814750",

appId:"1:971873814750:web:7418c7da119e4725ed9a4f"


};





const app = initializeApp(firebaseConfig);


const db = getDatabase(app);


const auth = getAuth(app);




const ADMIN_UID =
"VIAP56vYwndWPhJxktn0lRPTWnS2";



const list =
document.getElementById("tournamentList");


// ==========================
// ADMIN CHECK
// ==========================

onAuthStateChanged(auth,(user)=>{


if(!user){

alert("Admin Login Required");

location.href="index.html";

return;

}



if(user.uid !== ADMIN_UID){

alert("Access Denied");

location.href="index.html";

return;

}



loadTournament();


});





// ==========================
// LOAD TOURNAMENT
// ==========================


function loadTournament(){



onValue(ref(db,"matches"),(snap)=>{


list.innerHTML="";



if(!snap.exists()){


list.innerHTML=`

<div class="empty">

No Tournament Found

</div>

`;

return;

}





snap.forEach((item)=>{


const id=item.key;

const data=item.val();


const status=data.status || "upcoming";




list.innerHTML += `



<div class="tournament">



<div class="title">

${data.title || "BGMI Tournament"}

</div>





<div class="row">

<span>Mode</span>

<b>
${(data.type || "squad").toUpperCase()}
</b>

</div>





<div class="row">

<span>Entry Fee</span>

<b>
₹${data.entry || 0}
</b>

</div>





<div class="row">

<span>Players</span>

<b>
${data.booked || 0}/${data.total || 0}
</b>

</div>






<select

class="statusSelect"

id="status_${id}"

onchange="showRoomBox('${id}')"

>



<option value="upcoming"
${status==="upcoming"?"selected":""}>

Upcoming

</option>



<option value="live"
${status==="live"?"selected":""}>

Live

</option>



<option value="completed"
${status==="completed"?"selected":""}>

Completed

</option>



<option value="closed"
${status==="closed"?"selected":""}>

Closed

</option>



</select>







<div

class="roomBox"

id="roomBox_${id}"

style="display:${status==="upcoming"?"block":"none"}"

>



<input
class="roomInput"
id="groupLink_${id}"
placeholder="WhatsApp / Telegram Group Link"
value="${data.groupLink || ''}"
>



</div>







<button

class="actionBtn saveBtn"

onclick="saveStatus('${id}')"

>

💾 Save Status

</button>








<button

class="actionBtn deleteBtn"

onclick="deleteTournament('${id}')"

>

🗑 Delete Tournament

</button>







</div>



`;



});



});



}








// ==========================
// SHOW ROOM INPUT
// ==========================


window.showRoomBox=function(id){



let status =

document.getElementById("status_"+id).value;



let box =

document.getElementById("roomBox_"+id);




if(status==="upcoming"){

box.style.display="block";

}

else{


box.style.display="none";


}



}








// ==========================
// SAVE STATUS + ROOM
// ==========================


window.saveStatus = async function(id){

let status =
document.getElementById("status_"+id).value;


let updateData = {
status: status
};


// AGAR LIVE KIYA TO TIME SAVE KARO
if(status==="upcoming"){

updateData.groupLink =
document.getElementById("groupLink_"+id).value;

}


// AGAR COMPLETED YA CLOSED KIYA TO LIVE TIME REMOVE
if(status!=="live"){

updateData.liveAt = null;

}



await update(
ref(db,"matches/"+id),
updateData
);



alert("Status Updated");



// AUTO COMPLETE TIMER START

if(status==="live"){

setTimeout(async()=>{


await update(

ref(db,"matches/"+id),

{

status:"completed"

}

);


},20*60*1000);


}



};







// ==========================
// DELETE
// ==========================


window.deleteTournament=function(id){



let ok = confirm(
"Delete Tournament?"
);



if(!ok)

return;




remove(

ref(db,"matches/"+id)

);



alert("Tournament Deleted");



};




</script>


</body>

</html>
