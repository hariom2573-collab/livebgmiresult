<!DOCTYPE html>
<html>
<head>

<title>Admin Payment Setting</title>

<style>

body{
background:#050B18;
color:white;
font-family:Poppins,Arial;
padding:20px;
}

.box{
background:#111827;
padding:20px;
border-radius:20px;
max-width:400px;
margin:auto;
}

input,button{

width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:12px;

}

input{

background:#1f2937;
color:white;

}

button{

background:#22c55e;
font-weight:700;
}

img{

width:200px;
margin:20px auto;
display:block;
border-radius:15px;

}

</style>

</head>


<body>


<div class="box">


<h2>
💰 Payment Setting
</h2>


<input
id="upi"
placeholder="Enter UPI ID">


<button onclick="savePayment()">

Save Payment Setting

</button>


</div>




<script type="module">


import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";


import {

getDatabase,
ref,
set,
onValue

}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";


const firebaseConfig={


apiKey:"AIzaSyDsJUtZdIXcsB0w_2MQhMBXxIgbI3ijOvg",

authDomain:"incoinpaysliveearning.firebaseapp.com",

databaseURL:"https://incoinpaysliveearning-default-rtdb.firebaseio.com",

projectId:"incoinpaysliveearning",

storageBucket:"incoinpaysliveearning.firebasestorage.app",

messagingSenderId:"971873814750",

appId:"1:971873814750:web:7418c7da119e4725ed9a4f"


};



const app=initializeApp(firebaseConfig);

const db=getDatabase(app);
const auth = getAuth(app);

const ADMIN_UID = "VIAP56vYwndWPhJxktn0lRPTWnS2";

onAuthStateChanged(auth,(user)=>{

if(!user){
alert("Admin Login Required");
location.replace("admin.html");
return;
}

if(user.uid !== ADMIN_UID){
alert("Access Denied");
location.replace("index.html");
return;
}

});





// LOAD OLD SETTING


onValue(
ref(db,"settings/payment"),
(snap)=>{


if(snap.exists()){


let data=snap.val();


document.getElementById("upi").value=data.upi || "";

}


});







window.savePayment = async function(){

try{

let upi = document.getElementById("upi").value.trim();

if(!upi){
alert("Enter UPI ID");
return;
}

await set(ref(db,"settings/payment"),{
upi: upi,
updatedAt: Date.now()
});

alert("Payment Setting Saved");

}catch(err){

console.error(err);
alert(err.message);

}

};



</script>


</body>
</html>
