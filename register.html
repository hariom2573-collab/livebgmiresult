<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BGMI Register</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,Arial,sans-serif;
}

body{
background:#07111d;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

body::before{
content:"";
position:fixed;
width:450px;
height:450px;
background:#16a34a33;
border-radius:50%;
top:-180px;
right:-150px;
filter:blur(80px);
}

body::after{
content:"";
position:fixed;
width:350px;
height:350px;
background:#2563eb22;
border-radius:50%;
bottom:-150px;
left:-120px;
filter:blur(80px);
}

.card{

width:92%;
max-width:390px;
background:#111827;
border-radius:25px;
padding:28px;
position:relative;
z-index:2;
box-shadow:0 15px 40px rgba(0,0,0,.45);

}

.logo{

width:90px;
height:90px;
margin:auto;
border-radius:50%;
background:linear-gradient(135deg,#16a34a,#22c55e);
display:flex;
justify-content:center;
align-items:center;
font-size:42px;
box-shadow:0 0 25px rgba(34,197,94,.5);

}

h2{

text-align:center;
color:#fff;
margin-top:20px;
font-size:28px;

}

.sub{

text-align:center;
color:#94a3b8;
margin-top:6px;
margin-bottom:25px;
font-size:14px;

}

.input-box{

margin-top:16px;
position:relative;

}

.input-box input{

width:100%;
height:52px;
background:#1f2937;
border:none;
outline:none;
border-radius:14px;
padding:0 18px;
color:#fff;
font-size:15px;

}

.input-box input::placeholder{

color:#94a3b8;

}

#togglePassword{

position:absolute;
right:16px;
top:15px;
cursor:pointer;
font-size:20px;

}

button{

width:100%;
height:52px;
margin-top:22px;
border:none;
border-radius:14px;
background:#22c55e;
color:#fff;
font-size:17px;
font-weight:bold;
cursor:pointer;
transition:.3s;

}

button:hover{

background:#16a34a;

}

#msg{

margin-top:18px;
text-align:center;
font-size:14px;
font-weight:bold;

}

.bottom{

margin-top:25px;
text-align:center;
font-size:14px;
color:#94a3b8;

}

.bottom a{

color:#22c55e;
text-decoration:none;
font-weight:bold;

}

.loader{

display:none;
margin:auto;
margin-top:15px;
width:30px;
height:30px;
border:4px solid #1f2937;
border-top:4px solid #22c55e;
border-radius:50%;
animation:spin .8s linear infinite;

}

@keyframes spin{

100%{
transform:rotate(360deg);
}

}

</style>

</head>

<body>

<div class="card">

<div class="logo">
🎮
</div>

<h2>Create Account</h2>

<div class="sub">
Register & Start Playing BGMI
</div>

<div class="input-box">

<input
type="text"
id="name"
placeholder="Full Name">

</div>

<div class="input-box">

<input
type="email"
id="email"
placeholder="Email Address">

</div>

<div class="input-box">

<input
type="password"
id="password"
placeholder="Password">

<span id="togglePassword">
👁️
</span>

</div>

<button id="registerBtn">

REGISTER

</button>

<div class="loader" id="loader"></div>

<div id="msg"></div>

<div class="bottom">

Already have an account?

<a href="index.html">

Login

</a>

</div>

</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
updateProfile
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
getDatabase,
ref,
set
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";


const firebaseConfig={

apiKey:"AIzaSyDsJUtZdIXcsB0w_2MQhMBXxIgbI3ijOvg",

authDomain:"incoinpaysliveearning.firebaseapp.com",

databaseURL:"https://incoinpaysliveearning-default-rtdb.firebaseio.com",

projectId:"incoinpaysliveearning",

storageBucket:"incoinpaysliveearning.firebasestorage.app",

messagingSenderId:"971873814750",

appId:"1:971873814750:web:7418c7da119e4725ed9a4f"

};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getDatabase(app);


const btn=document.getElementById("registerBtn");
const loader=document.getElementById("loader");
const msg=document.getElementById("msg");



/* Show Hide Password */

document.getElementById("togglePassword").onclick=function(){

const pass=document.getElementById("password");

if(pass.type=="password"){

pass.type="text";
this.innerHTML="🙈";

}else{

pass.type="password";
this.innerHTML="👁️";

}

};



btn.onclick=async function(){


const name=document.getElementById("name").value.trim();

const email=document.getElementById("email").value.trim();

const password=document.getElementById("password").value.trim();


msg.innerHTML="";


if(name==""||email==""||password==""){

msg.style.color="#ef4444";

msg.innerHTML="⚠ Please fill all fields";

return;

}


btn.style.display="none";

loader.style.display="block";


try{


const result=await createUserWithEmailAndPassword(

auth,

email,

password

);


/* Save Display Name */

await updateProfile(result.user,{

displayName:name

});


/* Save Database */

await set(ref(db,"users/"+result.user.uid),{

uid:result.user.uid,

name:name,

email:email,

wallet:0,

createdAt:Date.now()

});


loader.style.display="none";

msg.style.color="#22c55e";

msg.innerHTML="✅ Registration Successful";


/* Auto Login + Redirect */

setTimeout(()=>{

location.href="dashboard.html";

},1000);


}catch(error){


loader.style.display="none";

btn.style.display="block";


switch(error.code){


case "auth/email-already-in-use":

msg.style.color="#ef4444";

msg.innerHTML="❌ Email already registered";

break;


case "auth/invalid-email":

msg.style.color="#ef4444";

msg.innerHTML="❌ Invalid Email Address";

break;


case "auth/weak-password":

msg.style.color="#ef4444";

msg.innerHTML="❌ Password must be at least 6 characters";

break;


default:

msg.style.color="#ef4444";

msg.innerHTML="❌ "+error.message;

break;

}


}


};

</script>

</body>
</html>
